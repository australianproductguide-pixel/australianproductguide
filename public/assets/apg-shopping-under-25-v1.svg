<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Australian Product Guide illustration for Amazon Australia items under 25 dollars browsing</title>
  <desc id="desc">Original APG artwork showing a price-filter tag, small shopping basket and neutral everyday-product silhouettes. It communicates a retailer price filter, not a discount claim.</desc>
  <defs>
    <linearGradient id="tag" x1="214" y1="76" x2="438" y2="316" gradientUnits="userSpaceOnUse"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
    <linearGradient id="cyan" x1="128" y1="70" x2="226" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
    <linearGradient id="card" x1="96" y1="48" x2="554" y2="352" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity=".14"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#2563EB" flood-opacity=".10"/></filter>
  </defs>
  <circle cx="320" cy="210" r="164" fill="#EFF6FF" opacity=".86"/>
  <g filter="url(#shadow)" transform="translate(205 72) rotate(-4 120 126)">
    <path d="M28 18c0-10 8-18 18-18h122l72 72-135 135H46c-10 0-18-8-18-18V18Z" fill="url(#tag)"/>
    <circle cx="74" cy="49" r="14" fill="#CFFAFE"/>
    <text x="124" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="850" fill="#FFFFFF">≤$25</text>
    <path d="M77 153h95" stroke="#BFDBFE" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g filter="url(#soft)" transform="translate(78 120)">
    <rect width="130" height="118" rx="28" fill="url(#card)" stroke="#DBEAFE"/>
    <path d="M35 51h60l-7 47H42l-7-47Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="6" stroke-linejoin="round"/>
    <path d="M47 51c0-16 8-27 18-27s18 11 18 27" fill="none" stroke="#06B6D4" stroke-width="6" stroke-linecap="round"/>
    <circle cx="53" cy="73" r="7" fill="#22D3EE"/>
    <circle cx="76" cy="73" r="7" fill="#2563EB"/>
  </g>
  <g filter="url(#soft)" transform="translate(420 92)">
    <rect width="132" height="112" rx="26" fill="#FFFFFF" stroke="#DBEAFE"/>
    <rect x="32" y="33" width="30" height="51" rx="7" fill="#CFFAFE" stroke="#06B6D4" stroke-width="5"/>
    <path d="M40 33v-8h14v8" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
    <path d="M76 82V39h26l5 43H76Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g filter="url(#soft)" transform="translate(408 246)">
    <rect width="144" height="104" rx="26" fill="url(#card)" stroke="#DBEAFE"/>
    <circle cx="50" cy="53" r="22" fill="#CFFAFE" stroke="#06B6D4" stroke-width="5"/>
    <circle cx="87" cy="47" r="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="5"/>
    <circle cx="105" cy="70" r="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="5"/>
  </g>
  <g transform="translate(114 280)" filter="url(#soft)">
    <rect width="112" height="78" rx="22" fill="#0F172A"/>
    <path d="m34 39 11-17h20l12 17H63l-8-12-8 12H34Z" fill="#38BDF8"/>
    <path d="m29 58 9-15h15L43 58H29Zm54 0-9-15H59l10 15h14Z" fill="#2563EB"/>
    <path d="m56 41 11 20-11-5-11 5 11-20Z" fill="#FFFFFF"/>
  </g>
</svg>