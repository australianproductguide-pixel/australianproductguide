name: APG Experience v37 Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: write

jobs:
  consumer-experience-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://australianproductguide.au
      OUTPUT_DIR: artifacts/experience-v37
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify v37 source contract
        run: |
          set -euo pipefail
          node --check lib/interaction-reliability-v37.js
          node --check scripts/interaction-reliability-v37-qa.js
          node --check scripts/experience-v37-browser-diagnostic.js
          node --check scripts/experience-v37-site-crawl.js
          node scripts/interaction-reliability-v37-qa.js
          node - <<'NODE'
          const app=require('./api/index');
          if(app.ASSET_PATH!=='/assets/interaction-reliability-v37.js')throw new Error(`v37 reliability asset is not present in the composed runtime: ${app.ASSET_PATH||'missing'}`);
          if(app.VERSION!=='37')throw new Error(`v37 reliability version is not present in the composed runtime: ${app.VERSION||'missing'}`);
          console.log('APG_V37_COMPOSED_RUNTIME=PASS');
          NODE
          grep -q "interaction-reliability-v37-qa.js" package.json
      - name: Wait for exact Production SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 96); do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA" >/tmp/v37-deployments.json
            id=$(jq -r '[.[]|select(.environment=="Production" or .original_environment=="Production")][0].id//empty' /tmp/v37-deployments.json)
            if [ -n "$id" ]; then
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments/$id/statuses" >/tmp/v37-statuses.json
              state=$(jq -r '.[0].state//empty' /tmp/v37-statuses.json)
              [ "$state" = failure ] || [ "$state" = error ] && exit 1
              [ "$state" = success ] && exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify live reliability asset
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/" >/tmp/v37-home.html
          grep -q '/assets/interaction-reliability-v37.js?v=37' /tmp/v37-home.html
          curl -fsSL -D /tmp/v37-asset-headers.txt "$BASE_URL/assets/interaction-reliability-v37.js?v=37" >/tmp/v37.js
          grep -q 'SCOUT_TIMEOUT_MS=15000' /tmp/v37.js
          grep -qi 'x-apg-interaction-reliability: v37' /tmp/v37-asset-headers.txt
      - name: Crawl every canonical Production route
        run: |
          set -euo pipefail
          REQUIRE_V37=1 node scripts/experience-v37-site-crawl.js
      - name: Certify desktop and mobile consumer journeys
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME="$CHROME" node scripts/experience-v37-browser-diagnostic.js
      - name: Confirm main remained on certified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/commits/main" | jq -r '.sha')
          test "$current" = "$SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apg-experience-v37-${{ github.run_id }}
          path: artifacts/experience-v37
          retention-days: 30
          if-no-files-found: warn
      - name: Publish APG v37 status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success; [ "$JOB_STATUS" = success ] || state=failure
          description="v37 full route + Search + Decision Lab + Compare + Scout certification: $JOB_STATUS"
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$(jq -n --arg state "$state" --arg context 'APG v37 Experience Certification' --arg description "$description" --arg target_url "https://github.com/$REPO/actions/runs/$RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
