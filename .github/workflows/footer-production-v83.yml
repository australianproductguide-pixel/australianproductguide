name: APG Footer Navigation Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: write

concurrency:
  group: apg-footer-navigation-verification
  cancel-in-progress: true

jobs:
  footer-browser:
    name: Exact Production Footer Clicks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://australianproductguide.au
      APG_EXPECTED_SHA: ${{ github.sha }}
      FOOTER_BROWSER_OUT: artifacts/production-footer-browser-v83
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Wait for exact Vercel Production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deployment_id=
          deployment_state=
          for attempt in $(seq 1 120); do
            if curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/deployments?sha=$SHA" \
              -o /tmp/apg-footer-deployments.json; then
              deployment_id=$(jq -r '[.[]|select(.environment=="Production" or .original_environment=="Production")][0].id//empty' /tmp/apg-footer-deployments.json)
              if [ -n "$deployment_id" ] && curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/deployments/$deployment_id/statuses" \
                -o /tmp/apg-footer-statuses.json; then
                deployment_state=$(jq -r '.[0].state//empty' /tmp/apg-footer-statuses.json)
                echo "Production deployment id=$deployment_id state=${deployment_state:-pending} sha=$SHA"
                if [ "$deployment_state" = failure ] || [ "$deployment_state" = error ]; then exit 1; fi
                if [ "$deployment_state" = success ]; then break; fi
              fi
            fi
            sleep 5
          done
          test -n "$deployment_id"
          test "$deployment_state" = success

      - name: Confirm exact public runtime SHA
        run: node scripts/wait-production-runtime-v61.js

      - name: Install browser dependency
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then echo "ERROR No Chrome/Chromium executable"; exit 1; fi
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null 2>&1

      - name: Click every footer navigation destination
        run: node scripts/production-footer-browser-v83.js

      - name: Upload footer verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apg-footer-navigation-${{ github.run_id }}
          path: artifacts/production-footer-browser-v83
          retention-days: 30
          if-no-files-found: warn

      - name: Publish footer verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          description="Footer navigation clicks GREEN"
          if [ "$JOB_STATUS" != success ]; then
            state=failure
            description="Footer navigation verification RED"
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context 'APG Footer Navigation Verification' \
            --arg description "$description" \
            --arg target_url "https://github.com/$REPO/actions/runs/$RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "$payload" >/dev/null
          test "$state" = success
