name: APG Decision Intelligence v4 QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'data/**'
      - 'lib/decision-**'
      - 'lib/search.js'
      - 'lib/search-base.js'
      - 'lib/search-v4.js'
      - 'lib/scout-v4.js'
      - 'lib/product-intelligence-v4.js'
      - 'lib/intelligence-quality-v4.js'
      - 'scripts/intelligence-quality-report-v4.js'
      - 'scripts/decision-intelligence-v4-runtime-qa.js'
      - '.github/workflows/decision-intelligence-qa.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intelligence-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and Scout asset
        run: |
          set -euo pipefail
          for f in api/index.js lib/decision-engine-v4.js lib/decision-page.js lib/search.js lib/search-base.js lib/search-v4.js lib/scout-v4.js lib/product-intelligence-v4.js lib/intelligence-quality-v4.js lib/decision-intelligence-v4.js scripts/intelligence-quality-report-v4.js scripts/decision-intelligence-v4-runtime-qa.js; do node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs'),scout=require('./lib/scout-v4');
          fs.writeFileSync('/tmp/scout-v4.js',scout.js);
          NODE
          node --check /tmp/scout-v4.js
          grep -q 'canonicalStateQuery' /tmp/scout-v4.js
          ! grep -q "state.turns.join" /tmp/scout-v4.js
      - name: Decision contract and hard constraints
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {products}=require('./data');
          const d=require('./lib/decision-engine-v4');
          assert.equal(d.ENGINE_VERSION,'decision-engine-v4');
          assert.equal(d.POLICY_VERSION,'decision-policy-v4.0');
          assert.equal(d.STATE_SCHEMA_VERSION,'decision-state-v1');
          const tv=d.interpretQuery('75-inch TV for a bright living room sport and Netflix under $2500');
          assert.equal(tv.categorySlug,'televisions');
          assert.equal(tv.budget,2500); assert.equal(tv.budgetHard,true);
          assert.equal(tv.numericConstraints[0]?.value,75); assert.equal(tv.numericConstraints[0]?.hard,false);
          const usb=d.interpretQuery('power bank must support USB-C for a laptop',{category:'power-banks'});
          assert(usb.requiredTags.includes('usb-c'));
          assert.equal(d.interpretQuery('TV under 75 inches',{category:'televisions'}).budget,null);
          assert.equal(d.interpretQuery('quiet dishwasher under 1000',{category:'dishwashers'}).budget,1000);
          const pub=d.publicDecision('quiet headphones for commuting with strong battery life',{category:'wireless-headphones'});
          assert.equal(pub.version,'decision-engine-v4'); assert.equal(pub.commercialRecommendationWeight,0);
          assert(pub.decisionState&&pub.recommendation&&Array.isArray(pub.paretoOptions));
          assert(pub.results.every(x=>!Object.prototype.hasOwnProperty.call(x,'score')));
          const priced=products.find(p=>Number(p.price)>1);if(priced){const out=d.publicDecision('',{category:priced.category,budget:String(Number(priced.price)-1)}),x=out.results.find(r=>r.slug===priced.slug);if(x)assert.notEqual(x.hardConstraintStatus,'eligible');}
          console.log('DECISION_V4_CONTRACT=PASS');
          NODE
      - name: Search, graph and current regressions
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {products}=require('./data');
          const canonical=require('./lib/search');
          const graph=require('./lib/product-intelligence-v4');
          const routes=require('./lib/routes');
          const {publicDecision}=require('./lib/decision-engine-v4');
          const s=canonical.searchSite('robot vacuum for pet hair and mopping');assert.equal(s.version,'search-ranking-v4');assert(s.products.length);assert(s.products.every(p=>p.category==='robot-vacuums'));
          const impossible=canonical.searchSite('TV must be exactly 999 inches');assert.equal(impossible.products.length,0);assert.equal(impossible.zeroResult?.reason,'hard-constraint-no-match');
          assert.equal(typeof canonical.searchIndex,'function');assert(canonical.searchIndex().length>500);
          const node=graph.knowledgeNode(products[0].slug);assert(node&&node.schemaVersion==='product-intelligence-v1'&&node.evidence&&node.relationships);
          const summary=graph.graphSummary();assert.equal(summary.brands,routes.brands.length);assert(summary.rawBrandLabels>=summary.brands);assert.equal(summary.brandEntityPolicy,'canonical-route-slug');
          const coffee=publicDecision('Easy automatic coffee machine under $1300 for milk drinks and switching beans');assert.equal(coffee.results[0]?.slug,'delonghi-rivelia-auto-milk-exam44055b');
          const mesh=publicDecision('mesh wifi for a large home with ethernet');assert.equal(mesh.interpretation.category,'Mesh Wi-Fi systems');assert(mesh.results.length);
          console.log('SEARCH_GRAPH_REGRESSIONS=PASS');
          NODE
      - name: Mature surface integration
        run: node scripts/decision-intelligence-v4-runtime-qa.js
      - name: Intelligence quality release gate
        run: node scripts/intelligence-quality-report-v4.js --gate | tee intelligence-quality-v4.json
      - uses: actions/upload-artifact@v4
        with:
          name: intelligence-quality-v4
          path: intelligence-quality-v4.json
          retention-days: 14
