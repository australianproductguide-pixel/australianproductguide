name: APG Premium Theme v31.1 QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contrast-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check final visual runtime
        run: |
          node --check lib/premium-theme-v311.js
          node --check lib/premium-theme-v31.js
          node --check lib/premium-brand-v30.js
          node --check api/index.js
      - name: Verify dark-surface contrast and final injection
        run: |
          node <<'NODE'
          const polish=require('./lib/premium-theme-v311');
          const css=polish.css||'';
          for(const token of ['#FFFFFF','#CBD5E1','#E2E8F0','#93C5FD']){
            if(!css.includes(token)) throw new Error(`Contrast token missing: ${token}`);
          }
          for(const selector of ['.apg-home-decision-panel-v9 h2','.apg-home-trust-v9 h2','.difference-engine h2','.site-header .apg-brand-v30-mark path:last-child']){
            if(!css.includes(selector)) throw new Error(`Dark-surface assurance missing: ${selector}`);
          }
          const fixture='<html><head></head><body data-theme-v31="true"></body></html>';
          const out=polish.injectPolish(fixture);
          if(!out.includes('/assets/premium-theme-v311.css?v=31.1')) throw new Error('Final polish stylesheet not injected');
          console.log('PASS: Premium Theme v31.1 dark applications and final stylesheet integration verified.');
          NODE
      - name: Verify complete visual runtime chain
        run: |
          grep -q "premium-theme-v311" api/index.js
          grep -q "premium-theme-v31" lib/premium-theme-v311.js
          grep -q "premium-brand-v30" lib/premium-theme-v31.js
          grep -q "amazon-conversion-v29" lib/premium-brand-v30.js
