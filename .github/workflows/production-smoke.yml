name: APG Production Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://au-product-guide.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Wait for matching Vercel Production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            deployments=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA")
            deployment_id=$(echo "$deployments" | jq -r '[.[] | select(.environment=="Production" or .original_environment=="Production")][0].id // empty')
            if [ -n "$deployment_id" ]; then
              statuses=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments/$deployment_id/statuses")
              state=$(echo "$statuses" | jq -r '.[0].state // empty')
              url=$(echo "$statuses" | jq -r '.[0].environment_url // .[0].target_url // empty')
              echo "Vercel Production state: ${state:-pending}"
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then exit 1; fi
              if [ "$state" = "success" ]; then echo "Immutable Production URL: ${url:-unknown}"; exit 0; fi
            fi
            sleep 5
          done
          echo 'Timed out waiting for matching Vercel Production deployment'; exit 1

      - name: Record authoritative source expectations
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/source-metrics.env
          const {products,categories,pathways}=require('./data');const {brands,pairPages,indexableRoutes}=require('./lib/routes');const {direct}=require('./data/retailers');
          const metrics={PRODUCTS:products.length,CATEGORIES:Object.keys(categories).length,EMPTY:pathways.filter(x=>!x.maintained).length,BRANDS:brands.length,PAIRS:pairPages.length,ROUTES:indexableRoutes.length,DIRECT:Object.keys(direct).length,FALLBACK:products.length-Object.keys(direct).length,DEEP:products.filter(x=>x.evidenceTier==='deep').length,STARTER:products.filter(x=>x.evidenceTier==='starter').length};
          for(const [k,v] of Object.entries(metrics))console.log(`${k}=${v}`);
          NODE
          cat /tmp/source-metrics.env
          source /tmp/source-metrics.env
          test "$PRODUCTS" = 257; test "$CATEGORIES" = 48; test "$EMPTY" = 0; test "$PAIRS" = 144; test "$DIRECT" = 6; test "$FALLBACK" = 251; test "$DEEP" = 37; test "$STARTER" = 220

      - name: Verify public shell assets navigation sharing and platform hubs
        run: |
          set -euo pipefail
          code=$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$BASE_URL/"); test "$code" = "200"
          for token in 'Australian Product Guide' 'Find the product that fits' 'data-platform-v3="true"' 'data-mega-trigger' 'Decision Lab' 'Buying guides' 'My APG' 'data-share-surface' 'Legal & transparency'; do grep -qi "$token" /tmp/home.html; done
          grep -q 'rel="canonical" href="https://au-product-guide.vercel.app/"' /tmp/home.html
          grep -q 'SearchAction' /tmp/home.html
          if grep -qiE 'authentication required|vercel authentication|log in to vercel|sign in to vercel|Login – Vercel' /tmp/home.html; then exit 1; fi
          for asset in /assets/site.css /assets/app.js /assets/search-index.json /assets/logo.svg /assets/social.svg; do code=$(curl -sS -L -o /tmp/asset -w '%{http_code}' "$BASE_URL$asset"); echo "$asset HTTP $code"; test "$code" = "200"; done
          curl -fsSL "$BASE_URL/assets/app.js" -o /tmp/apg-app.js; node --check /tmp/apg-app.js
          for token in apgSaved apgDecisionHistory apgSavedComparisons apgSavedGuides apgRecentSearches navigator.share data-copy-share; do grep -q "$token" /tmp/apg-app.js; done
          curl -fsSL "$BASE_URL/assets/site.css" -o /tmp/site.css
          for token in platform-sharebar freshness-panel platform-hub-grid account-readiness focus-visible prefers-reduced-motion; do grep -q "$token" /tmp/site.css; done
          source /tmp/source-metrics.env
          curl -fsSL "$BASE_URL/assets/search-index.json" -o /tmp/search-index.json; test "$(jq 'length' /tmp/search-index.json)" -ge 350
          for path in /categories/ /compare/ /guides/ /retailers/ /brands/ /decision-lab/ /my-apg/; do code=$(curl -sS -L -o /tmp/hub.html -w '%{http_code}' "$BASE_URL$path"); echo "$path $code"; test "$code" = "200"; done
          code=$(curl -sS -o /tmp/notfound.html -w '%{http_code}' "$BASE_URL/__apg-v3-404-test__/"); test "$code" = "404"; grep -qi 'not in the maintained guide' /tmp/notfound.html
          echo 'PUBLIC_PLATFORM_SHELL=PASS'

      - name: Crawl all canonical indexable routes and SEO controls
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/sitemap.xml" -o /tmp/sitemap.xml
          curl -fsSL "$BASE_URL/robots.txt" -o /tmp/robots.txt
          grep -q 'Sitemap: https://au-product-guide.vercel.app/sitemap.xml' /tmp/robots.txt
          grep -q 'Disallow: /search/' /tmp/robots.txt; grep -q 'Disallow: /compare/custom/' /tmp/robots.txt
          BASE_URL="$BASE_URL" node - <<'NODE'
          const fs=require('fs');const {indexableRoutes}=require('./lib/routes');
          const base=process.env.BASE_URL,xml=fs.readFileSync('/tmp/sitemap.xml','utf8'),urls=[...xml.matchAll(/<loc>(.*?)<\/loc>/gi)].map(m=>m[1]);
          if(urls.length!==indexableRoutes.length||new Set(urls).size!==indexableRoutes.length)throw new Error(`sitemap ${urls.length}/${new Set(urls).size}; expected ${indexableRoutes.length}`);
          const expected=new Set(indexableRoutes.map(p=>base+p));for(const u of urls)if(!expected.has(u))throw new Error(`unexpected sitemap URL ${u}`);
          let next=0,done=0;const failures=[];
          async function worker(){while(true){const i=next++;if(i>=urls.length)return;const url=urls[i],path=new URL(url).pathname;try{const r=await fetch(url,{headers:{'user-agent':'APG-v3-crawl/1.0'}});if(r.status!==200)throw new Error(`HTTP ${r.status}`);const text=await r.text();if(!text.includes(`<link rel="canonical" href="${base+path}"`))throw new Error('bad canonical');if(/<meta name="robots" content="noindex/i.test(text))throw new Error('indexable route is noindex');if(/Australian Tradie Software Matcher/i.test(text))throw new Error('venture contamination');}catch(e){failures.push(`${path}: ${e.message}`);}done++;if(done%100===0)console.log(`CRAWLED=${done}/${urls.length}`);}}
          Promise.all(Array.from({length:12},worker)).then(()=>{if(failures.length){console.error(failures.slice(0,30).join('\n'));process.exit(1)}console.log(`FULL_INDEXABLE_CRAWL=${urls.length}/${urls.length}_HTTP_200`);console.log(`CANONICALS=${urls.length}/${urls.length}_PRODUCTION_HOST`);});
          NODE

      - name: Verify representative shopping journeys across major category families
        run: |
          set -euo pipefail
          check(){ name="$1"; path="$2"; token="$3"; code=$(curl -sS -L -o "/tmp/$name.html" -w '%{http_code}' "$BASE_URL$path"); test "$code" = "200"; grep -qi "$token" "/tmp/$name.html"; }
          check coffee '/categories/coffee-machines/' 'Deep evidence'
          check security '/categories/home-security-cameras/' 'Starter evidence'
          check office '/categories/office-chairs/' 'Office chairs'
          check wearable '/categories/smartwatches/' 'Smartwatches'
          check kitchen '/categories/blenders/' 'Blenders'
          check power '/categories/portable-power-stations/' 'Portable power'
          check product '/products/amazon-eero-max-7/' 'Evidence freshness'
          check finder '/categories/office-chairs/finder/?priority=ergonomic&secondary=lumbar' 'Best match'
          check categorycompare '/compare/office-chairs/' 'Compare'
          check guide '/guides/office-chairs-buying-guide/' 'Starter evidence'
          check search '/search/?q=ergonomic+office+chair+with+lumbar+support' 'Office'
          check decision '/decision-lab/?q=mesh+wifi+for+a+large+home+with+ethernet' 'Decision Engine v3'
          check workspace '/my-apg/' 'Optional account sync'
          for path in /about/ /methodology/ /editorial-standards/ /sources/ /corrections-policy/ /affiliate-disclosure/ /privacy/ /terms/ /contact/ /coverage/ /updates/ /retailers/; do code=$(curl -sS -L -o /tmp/trust.html -w '%{http_code}' "$BASE_URL$path"); test "$code" = "200"; done
          grep -qi 'Consumer accounts are not active' <(curl -fsSL "$BASE_URL/privacy/")
          grep -qi 'Consumer accounts are not active' <(curl -fsSL "$BASE_URL/terms/")
          echo 'REPRESENTATIVE_JOURNEYS=PASS'

      - name: Verify every product route affiliate schema evidence and image controls
        run: |
          set -euo pipefail
          BASE_URL="$BASE_URL" node - <<'NODE'
          const {products}=require('./data');const base=process.env.BASE_URL;let next=0,direct=0,fallback=0,owned=0;const failures=[];
          async function worker(){while(true){const i=next++;if(i>=products.length)return;const p=products[i],path=`/products/${p.slug}/`;try{const r=await fetch(base+path,{headers:{'user-agent':'APG-v3-product-QA/1.0'}});if(r.status!==200)throw new Error(`HTTP ${r.status}`);const text=await r.text();for(const [name,needle] of [['tag','auproductguid-22'],['sponsored','rel="sponsored nofollow noopener"'],['paid','Affiliate paid link'],['schema','"@type":"Product"'],['breadcrumb','"@type":"BreadcrumbList"'],['commercial','Commercial score'],['freshness','Evidence freshness']])if(!text.includes(needle))throw new Error(`missing ${name}`);if(text.includes('Exact individual product page verified'))direct++;if(text.includes('Model-specific search fallback'))fallback++;if(text.includes('APG-authored SVG/CSS decision visual')||text.includes('genuine product photography pending verified rights'))owned++;if(p.evidenceTier==='starter'&&!text.includes('Starter evidence'))throw new Error('starter evidence not disclosed');}catch(e){failures.push(`${path}: ${e.message}`);}}}
          Promise.all(Array.from({length:10},worker)).then(()=>{console.log(`AMAZON_DIRECT_PRODUCT_PAGES=${direct}`);console.log(`AMAZON_FALLBACK_SEARCH_PAGES=${fallback}`);console.log(`APG_OWNED_OR_PLACEHOLDER_VISUALS=${owned}`);if(failures.length){console.error(failures.slice(0,30).join('\n'));process.exit(1)}if(direct!==6||fallback!==251)throw new Error(`retailer counts ${direct}/${fallback}`);console.log(`PRODUCT_ROUTE_QA=${products.length}/${products.length}_PASS`);});
          NODE
          for spec in 'amazon-eero-max-7 B0CPKX85TD' 'anker-737-power-bank-24000mah-140w B09VPHVT2Z' 'amazon-kindle-paperwhite-signature-edition-32gb B0CFPHSTDD' 'bose-quietcomfort-ultra-headphones B0CCZ1HQ39' 'sennheiser-momentum-4-wireless B0CCRZPKR1' 'philips-5000-series-dual-basket-na55100 B0DHS253VZ'; do set -- $spec; curl -fsSL "$BASE_URL/products/$1/" | grep -q "$2"; done
          echo 'VERIFIED_DIRECT_ASINS=6/6_PASS'

      - name: Verify share privacy SEO noindex and account boundary
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/decision-lab/?q=robot+vacuum+for+pets&category=robot-vacuums&_vercel_share=SECRET&utm_source=smoke" -o /tmp/share-lab.html
          grep -qi 'noindex,follow' /tmp/share-lab.html; grep -q 'data-share-surface' /tmp/share-lab.html
          if grep -qE '_vercel_share|utm_source|SECRET' /tmp/share-lab.html; then exit 1; fi
          curl -fsSL "$BASE_URL/compare/custom/?products=sony-wh-1000xm6,bose-quietcomfort-ultra-headphones,INVALID&_vercel_share=SECRET" -o /tmp/share-compare.html
          grep -qi 'noindex,follow' /tmp/share-compare.html; grep -q 'data-share-surface' /tmp/share-compare.html
          if grep -qE '_vercel_share|SECRET|INVALID' /tmp/share-compare.html; then exit 1; fi
          for p in /decision-lab/ /my-apg/ /search/ '/compare/custom/?products=sony-wh-1000xm6,bose-quietcomfort-ultra-headphones'; do curl -fsSL "$BASE_URL$p" | grep -qi 'noindex,follow'; done
          if curl -fsSL "$BASE_URL/my-apg/" | grep -qiE 'sign in with supabase|firebaseio|clerk\.com'; then exit 1; fi
          echo 'PRIVACY_NOINDEX_ACCOUNT_BOUNDARY=PASS'

      - name: Render desktop tablet and mobile visual QA with performance sanity checks
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true); test -n "$CHROME"
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null 2>&1
          mkdir -p visual-qa
          CHROME="$CHROME" BASE_URL="$BASE_URL" node - <<'NODE'
          const puppeteer=require('puppeteer-core');const fs=require('fs');const base=process.env.BASE_URL,chrome=process.env.CHROME;
          const viewports=[['desktop',1440,1000],['tablet',900,1100],['mobile',390,844]];
          const pages=[['home','/'],['categories','/categories/'],['starter-category','/categories/office-chairs/'],['starter-product','/products/amazon-eero-max-7/'],['compare','/compare/'],['custom-compare','/compare/custom/?products=sony-wh-1000xm6,bose-quietcomfort-ultra-headphones'],['decision','/decision-lab/?q=mesh+wifi+for+a+large+home+with+ethernet'],['workspace','/my-apg/'],['guide','/guides/office-chairs-buying-guide/'],['privacy','/privacy/'],['notfound','/__apg-v3-visual-404__/']];
          (async()=>{const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage']});const failures=[],report=[];
          for(const [vp,w,h] of viewports){for(const [name,path] of pages){const page=await browser.newPage();await page.setViewport({width:w,height:h,deviceScaleFactor:1});const errors=[];page.on('pageerror',e=>errors.push(e.message));const response=await page.goto(base+path,{waitUntil:'networkidle0',timeout:30000});await page.screenshot({path:`visual-qa/${vp}-${name}.png`,fullPage:true});const m=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,bodyText:document.body.innerText.length,nav:!!document.querySelector('.site-header'),footer:!!document.querySelector('footer'),platform:document.body.dataset.platformV3||null,resources:performance.getEntriesByType('resource').reduce((n,x)=>n+(x.transferSize||0),0)}));if(m.scrollWidth>m.clientWidth+2)failures.push(`${vp}/${name} overflow ${m.scrollWidth}>${m.clientWidth}`);if(!m.nav||!m.footer||m.bodyText<100)failures.push(`${vp}/${name} incomplete shell`);if(path!=='/__apg-v3-visual-404__/'&&m.platform!=='true')failures.push(`${vp}/${name} missing platform marker`);if(errors.length)failures.push(`${vp}/${name} page errors ${errors.join(' | ')}`);if(m.resources>2500000)failures.push(`${vp}/${name} excessive transferred resources ${m.resources}`);report.push({vp,name,status:response?.status(),...m});await page.close();}}
          await browser.close();fs.writeFileSync('visual-qa/report.json',JSON.stringify(report,null,2));if(failures.length){console.error(failures.join('\n'));process.exit(1)}console.log(`VISUAL_QA=${report.length}/${report.length}_PASS`);})();
          NODE

      - name: Upload Platform v3 visual QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: apg-platform-v3-visual-qa-${{ github.run_id }}
          path: visual-qa
          retention-days: 30
