name: APG Production Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://au-product-guide.vercel.app
    steps:
      - name: Wait for matching Vercel Production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            deployments=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA")
            deployment_id=$(echo "$deployments" | jq -r '[.[] | select(.environment=="Production" or .original_environment=="Production")][0].id // empty')
            if [ -n "$deployment_id" ]; then
              statuses=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments/$deployment_id/statuses")
              state=$(echo "$statuses" | jq -r '.[0].state // empty')
              url=$(echo "$statuses" | jq -r '.[0].environment_url // .[0].target_url // empty')
              echo "Vercel Production state: ${state:-pending}"
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then exit 1; fi
              if [ "$state" = "success" ]; then
                echo "Immutable Production deployment URL: ${url:-unknown}"
                echo "Clean Production alias: $BASE_URL"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Timed out waiting for Vercel Production deployment'
          exit 1

      - name: Verify public homepage system routes and enhancement assets
        run: |
          set -euo pipefail
          code=$(curl -sS -L -D /tmp/home.headers -o /tmp/home.html -w '%{http_code}' "$BASE_URL/")
          echo "Homepage HTTP: $code"
          test "$code" = "200"
          grep -qi 'Compare smarter' /tmp/home.html
          grep -qi 'Australian Product Guide' /tmp/home.html
          grep -q 'rel="canonical" href="https://au-product-guide.vercel.app/"' /tmp/home.html
          grep -q 'SearchAction' /tmp/home.html
          if grep -qiE 'authentication required|vercel authentication|log in to vercel|sign in to vercel|Login – Vercel' /tmp/home.html; then exit 1; fi
          for asset in /assets/site.css /assets/app.js /assets/search-index.json /assets/logo.svg /assets/social.svg; do
            code=$(curl -sS -L -o /tmp/asset -w '%{http_code}' "$BASE_URL$asset")
            echo "$asset HTTP: $code"
            test "$code" = "200"
          done
          curl -fsSL "$BASE_URL/assets/app.js" -o /tmp/apg-app.js
          node --check /tmp/apg-app.js
          curl -fsSL "$BASE_URL/assets/site.css" -o /tmp/site.css
          grep -q '@media(max-width:720px)' /tmp/site.css
          grep -q 'name="viewport"' /tmp/home.html
          curl -fsSL "$BASE_URL/assets/search-index.json" -o /tmp/search-index.json
          test "$(jq 'length' /tmp/search-index.json)" -gt 45
          code=$(curl -sS -L -o /tmp/sitemap.xml -w '%{http_code}' "$BASE_URL/sitemap.xml")
          test "$code" = "200"
          code=$(curl -sS -L -o /tmp/robots.txt -w '%{http_code}' "$BASE_URL/robots.txt")
          test "$code" = "200"
          grep -q 'Sitemap: https://au-product-guide.vercel.app/sitemap.xml' /tmp/robots.txt
          grep -q 'Disallow: /search/' /tmp/robots.txt
          grep -q 'Disallow: /compare/custom/' /tmp/robots.txt
          code=$(curl -sS -o /tmp/notfound.html -w '%{http_code}' "$BASE_URL/__apg-growth-genuine-404-test__/")
          test "$code" = "404"
          grep -qi 'not in the maintained guide' /tmp/notfound.html
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL/coffee-machines")
          location=$(curl -sSI "$BASE_URL/coffee-machines" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1}/^location:/{print $2; exit}')
          test "$code" = "308"
          test "$location" = "/categories/coffee-machines/"
          echo 'PUBLIC_SHELL_AND_ASSETS=PASS'

      - name: Crawl every canonical indexable route
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,urllib.parse,urllib.request
          base=os.environ['BASE_URL']
          xml=open('/tmp/sitemap.xml',encoding='utf-8').read()
          urls=re.findall(r'<loc>(.*?)</loc>',xml,re.I)
          print('SITEMAP_URL_COUNT='+str(len(urls)))
          if len(urls)!=139: raise SystemExit(f'Expected 139 sitemap URLs, found {len(urls)}')
          if len(set(urls))!=139: raise SystemExit('Duplicate sitemap URLs')
          for u in urls:
              if not u.startswith(base+'/') and u!=base+'/': raise SystemExit('Non-Production sitemap hostname: '+u)
              p=urllib.parse.urlsplit(u).path
              req=urllib.request.Request(base+p,headers={'User-Agent':'APG-Growth-Full-Crawl/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  if r.status!=200: raise SystemExit(f'{p} returned {r.status}')
                  text=r.read().decode('utf-8','replace')
              expected=base+p
              m=re.search(r'<link rel="canonical" href="([^"]+)"',text,re.I)
              if not m or m.group(1)!=expected: raise SystemExit(f'Bad canonical {p}: {m.group(1) if m else "missing"}')
              if re.search(r'<meta name="robots" content="noindex',text,re.I): raise SystemExit('Indexable route is noindex: '+p)
              if 'australian-tradie-software-matcher' in text.lower() or 'australian tradie software matcher' in text.lower(): raise SystemExit('Tradie contamination: '+p)
              if '<title>' not in text.lower(): raise SystemExit('Missing title: '+p)
          print('FULL_INDEXABLE_CRAWL=139/139_HTTP_200')
          print('CANONICALS=139/139_PRODUCTION_HOST')
          print('INDEXABLE_NOINDEX_ERRORS=0')
          print('TRADIE_CONTAMINATION=ABSENT_ALL_INDEXABLE_ROUTES')
          PY

      - name: Verify search comparison finders trust and mobile journeys
        run: |
          set -euo pipefail
          check_search(){
            id="$1"; query="$2"; expected="$3"
            code=$(curl -sS -L -o "/tmp/$id.html" -w '%{http_code}' "$BASE_URL/search/?q=$query")
            echo "$id HTTP: $code"
            test "$code" = "200"
            grep -qi 'noindex,follow' "/tmp/$id.html"
            grep -qi "$expected" "/tmp/$id.html"
          }
          check_search coffee 'best+coffee+machine+under+%24800' 'Coffee'
          check_search pets 'robot+vacuum+for+pet+hair' 'Robot'
          check_search sony 'Sony+headphones' 'Sony'
          check_search family 'air+fryer+for+family+of+4' 'Air'
          check_search value 'best+value+headphones' 'headphones'
          check_search versus 'Breville+vs+DeLonghi' 'Direct comparison detected'

          code=$(curl -sS -L -o /tmp/custom.html -w '%{http_code}' "$BASE_URL/compare/custom/?products=sony-wh-1000xm6,bose-quietcomfort-ultra-headphones")
          test "$code" = "200"
          grep -qi 'noindex,follow' /tmp/custom.html
          grep -q 'WH-1000XM6' /tmp/custom.html
          grep -q 'QuietComfort Ultra' /tmp/custom.html

          code=$(curl -sS -L -o /tmp/airfinder.html -w '%{http_code}' "$BASE_URL/categories/air-fryers/finder/?priority=family&secondary=dual-zone&position=value")
          test "$code" = "200"
          grep -qi 'Best match' /tmp/airfinder.html
          grep -qi 'Useful alternatives' /tmp/airfinder.html

          code=$(curl -sS -L -o /tmp/category.html -w '%{http_code}' "$BASE_URL/categories/coffee-machines/?priority=value&sort=price")
          test "$code" = "200"
          grep -qi 'Product catalogue' /tmp/category.html
          grep -qi 'Add to compare' /tmp/category.html

          for path in /about/ /methodology/ /editorial-standards/ /sources/ /corrections-policy/ /affiliate-disclosure/ /privacy/ /terms/ /contact/ /coverage/ /updates/; do
            code=$(curl -sS -L -o /tmp/trust.html -w '%{http_code}' "$BASE_URL$path")
            echo "$path HTTP: $code"
            test "$code" = "200"
          done
          curl -fsSL "$BASE_URL/privacy/" -o /tmp/privacy.html
          grep -qi 'local storage' /tmp/privacy.html
          grep -qi 'Legal review note' /tmp/privacy.html
          curl -fsSL "$BASE_URL/terms/" -o /tmp/terms.html
          grep -qi 'Legal review note' /tmp/terms.html
          echo 'SEARCH_COMPARE_FINDERS_TRUST=PASS'

      - name: Verify seven coffee matcher regression profiles
        run: |
          set -euo pipefail
          check_profile(){
            id="$1"; query="$2"; expected="$3"
            code=$(curl -sS -L -o "/tmp/$id.html" -w '%{http_code}' "$BASE_URL/categories/coffee-machines/finder/?$query")
            echo "$id HTTP: $code Expected: $expected"
            test "$code" = "200"
            grep -qi 'Best match' "/tmp/$id.html"
            grep -qi "$expected" "/tmp/$id.html"
            grep -qi 'Affiliate relationships contribute zero points' "/tmp/$id.html"
          }
          check_profile QA001 'workflow=one-touch&drink=milk&learning=almost&budget=1500&speed=high&space=normal&beans=rarely' 'Magnifica Start with Milk'
          check_profile QA002 'workflow=guided&drink=milk&learning=some&budget=2000&speed=medium&space=normal&beans=sometimes' 'Barista Touch BES880'
          check_profile QA003 'workflow=guided&drink=black&learning=some&budget=700&speed=medium&space=normal&beans=rarely' 'Barista Max EM5300S'
          check_profile QA004 'workflow=manual&drink=mixed&learning=control&budget=1500&speed=low&space=any&beans=often' 'La Specialista Opera'
          check_profile QA005 'workflow=one-touch&drink=mixed&learning=almost&budget=1500&speed=high&space=compact&beans=sometimes' 'Magnifica Evo'
          check_profile QA006 'workflow=guided&drink=cold&learning=some&budget=2000&speed=medium&space=normal&beans=rarely' 'Barista Touch Impress'
          check_profile QA007 'workflow=one-touch&drink=mixed&learning=almost&budget=1500&speed=high&space=normal&beans=often' 'Rivelia Auto Milk'
          echo 'COFFEE_MATCHER_QA=7/7_PASS'

      - name: Verify all product evidence retailer affiliate and schema controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,urllib.parse,urllib.request
          base=os.environ['BASE_URL']
          xml=open('/tmp/sitemap.xml',encoding='utf-8').read()
          urls=re.findall(r'<loc>(.*?)</loc>',xml,re.I)
          products=[urllib.parse.urlsplit(u).path for u in urls if '/products/' in u]
          if len(products)!=37: raise SystemExit(f'Expected 37 product routes, found {len(products)}')
          direct=fallback=0
          for p in products:
              req=urllib.request.Request(base+p,headers={'User-Agent':'APG-Growth-Retailer-QA/1.0'})
              text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              checks={
                'tag':'auproductguid-22',
                'sponsored':'rel="sponsored nofollow noopener"',
                'paid':'Affiliate paid link',
                'product_schema':'"@type":"Product"',
                'breadcrumb_schema':'"@type":"BreadcrumbList"',
                'testing':'Desk-researched / specification-based',
                'reviewed':'15 August 2026',
                'commercial':'Commercial score'
              }
              for name,needle in checks.items():
                  if needle not in text: raise SystemExit(f'Missing {name} control: {p}')
              if 'Exact product page verified' in text: direct+=1
              if 'Model-specific search fallback' in text: fallback+=1
          print(f'AMAZON_DIRECT_PRODUCT_PAGES={direct}')
          print(f'AMAZON_FALLBACK_SEARCH_PAGES={fallback}')
          if direct!=2: raise SystemExit(f'Expected 2 direct Amazon pages, found {direct}')
          if fallback!=35: raise SystemExit(f'Expected 35 fallback pages, found {fallback}')
          print('PRODUCT_RETAILER_EVIDENCE_SCHEMA=37/37_PASS')
          PY
          curl -fsSL "$BASE_URL/products/bose-quietcomfort-ultra-headphones/" -o /tmp/bose.html
          grep -q 'B0CCZ1HQ39' /tmp/bose.html
          curl -fsSL "$BASE_URL/products/sennheiser-momentum-4-wireless/" -o /tmp/momentum.html
          grep -q 'B0CCRZPKR1' /tmp/momentum.html
          curl -fsSL "$BASE_URL/affiliate-disclosure/" -o /tmp/disclosure.html
          grep -q 'As an Amazon Associate' /tmp/disclosure.html
          grep -q 'auproductguid-22' /tmp/disclosure.html
          echo 'AFFILIATE_DISCLOSURE_AND_DIRECT_ASINS=PASS'
