name: APG Production Verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_certification:
        description: Run the heavyweight source assurance suite after Production certification
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  deployments: read
  statuses: write

concurrency:
  group: apg-production-verification
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Production HTTP Contract
    runs-on: ubuntu-latest
    outputs:
      github_deployment_id: ${{ steps.vercel.outputs.deployment_id }}
    timeout-minutes: 15
    env:
      BASE_URL: https://australianproductguide.au
      APG_EXPECTED_SHA: ${{ github.sha }}
      HTTP_CONTRACT_OUT: artifacts/production-http-contract-v61
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Wait for exact Vercel Production deployment
        id: vercel
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deployment_id=
          deployment_state=
          for attempt in $(seq 1 120); do
            if ! curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/deployments?sha=$SHA" \
              -o /tmp/apg-deployments.json; then
              echo "WARN deployment lookup transport failure attempt=$attempt"
              sleep 5
              continue
            fi
            deployment_id=$(jq -r '[.[]|select(.environment=="Production" or .original_environment=="Production")][0].id//empty' /tmp/apg-deployments.json)
            if [ -n "$deployment_id" ]; then
              if ! curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/deployments/$deployment_id/statuses" \
                -o /tmp/apg-deployment-statuses.json; then
                echo "WARN deployment status transport failure id=$deployment_id attempt=$attempt"
                sleep 5
                continue
              fi
              deployment_state=$(jq -r '.[0].state//empty' /tmp/apg-deployment-statuses.json)
              echo "Production deployment id=$deployment_id state=${deployment_state:-pending} sha=$SHA"
              if [ "$deployment_state" = failure ] || [ "$deployment_state" = error ]; then
                echo "ERROR Vercel Production deployment reported $deployment_state for SHA $SHA"
                exit 1
              fi
              if [ "$deployment_state" = success ]; then break; fi
            else
              echo "Production deployment not registered yet for SHA $SHA attempt=$attempt"
            fi
            sleep 5
          done
          if [ -z "$deployment_id" ] || [ "$deployment_state" != success ]; then
            echo "ERROR No successful Production deployment was observed for exact SHA $SHA"
            exit 1
          fi
          echo "APG_GITHUB_DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Reconcile exact public runtime
        run: node scripts/wait-production-runtime-v61.js

      - name: Verify Production HTTP contracts
        run: node scripts/production-http-contract-v61.js

      - name: Upload HTTP verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apg-production-http-${{ github.run_id }}
          path: artifacts/production-http-contract-v61
          retention-days: 30
          if-no-files-found: error

  production-browser-certification:
    name: Production Browser, Visual & Accessibility
    needs: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_URL: https://australianproductguide.au
      APG_EXPECTED_SHA: ${{ github.sha }}
      APG_GITHUB_DEPLOYMENT_ID: ${{ needs.production-smoke.outputs.github_deployment_id }}
      CRITICAL_BROWSER_OUT: artifacts/production-critical-browser-v61
      SCOUT_GLOBAL_BROWSER_OUT: artifacts/production-scout-global-v111
      MEASUREMENT_CERT_OUT: artifacts/production-measurement-certification-v89
      FOOTER_BROWSER_OUT: artifacts/production-footer-browser-v83
      BRAND_PARITY_OUT: artifacts/production-brand-parity-v91
      VISUAL_OUT: artifacts/production-visual-v28
      TABLET_VISUAL_OUT: artifacts/production-tablet-visual-v61
      A11Y_OUT: artifacts/production-accessibility-v61
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install browser certification dependencies
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            echo "ERROR No Chrome/Chromium executable is available on the runner"
            exit 1
          fi
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 axe-core@4.10.3 >/dev/null 2>&1

      - name: Run critical browser journeys
        run: node scripts/production-critical-browser-v61.js

      - name: Certify Scout is visible and clickable on non-home routes
        run: node scripts/production-scout-global-browser-v111.js

      - name: Certify Production GA consent, privacy and transport
        run: node scripts/production-measurement-certification-v89.js

      - name: Verify desktop and mobile footer navigation
        run: node scripts/production-footer-browser-v83.js

      - name: Verify desktop and mobile brand identity parity
        run: node scripts/production-brand-parity-v91.js

      - name: Capture desktop and mobile Production visual matrix
        if: always()
        run: node scripts/production-visual-v28.js

      - name: Capture tablet portrait and landscape Production matrix
        if: always()
        run: node scripts/production-tablet-visual-v61.js

      - name: Run Production accessibility gate
        if: always()
        run: node scripts/production-accessibility-v61.js

      - name: Upload browser, Scout, measurement, brand, visual and accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apg-production-browser-${{ github.run_id }}
          path: |
            artifacts/production-critical-browser-v61
            artifacts/production-scout-global-v111
            artifacts/production-measurement-certification-v89
            artifacts/production-footer-browser-v83
            artifacts/production-brand-parity-v91
            artifacts/production-visual-v28
            artifacts/production-tablet-visual-v61
            artifacts/production-accessibility-v61
          retention-days: 30
          if-no-files-found: warn

  publish-verification:
    name: Publish Production Verification
    if: always()
    needs: [production-smoke, production-browser-certification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish exact-SHA release status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          HTTP_STATUS: ${{ needs.production-smoke.result }}
          BROWSER_STATUS: ${{ needs.production-browser-certification.result }}
        run: |
          set -euo pipefail
          state=success
          description="Production HTTP + browser + measurement QA GREEN"
          if [ "$HTTP_STATUS" != success ] || [ "$BROWSER_STATUS" != success ]; then
            state=failure
            description="Production QA RED: http=$HTTP_STATUS browser=$BROWSER_STATUS"
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context 'APG Production Verification' \
            --arg description "$description" \
            --arg target_url "https://github.com/$REPO/actions/runs/$RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "$payload" >/dev/null
          echo "APG Production Verification state=$state http=$HTTP_STATUS browser=$BROWSER_STATUS sha=$SHA"
          test "$state" = success

  full-certification:
    name: Manual Full Source Certification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_certification }}
    needs: production-browser-certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run full source assurance on GitHub infrastructure
        run: |
          set -euo pipefail
          npm run qa:full
          node scripts/scout-global-surface-v111-qa.js
          node scripts/account-profile-v24-qa.js
          node scripts/account-governance-v25-qa.js
          node scripts/auth-hardening-v23-qa.js
          node scripts/search-model-relevance-v36-qa.js
          node scripts/catalogue-source-authority-qa.js
          node scripts/amazon-associates-qa.js
          node scripts/product-image-qa.js
          node scripts/editorial-compliance-qa.js
          node scripts/trust-infrastructure-v28-qa.js