name: APG Production Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://australianproductguide.au
    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact Vercel Production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            d=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA")
            id=$(echo "$d"|jq -r '[.[]|select(.environment=="Production" or .original_environment=="Production")][0].id//empty')
            if [ -n "$id" ]; then
              s=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments/$id/statuses")
              state=$(echo "$s"|jq -r '.[0].state//empty'); echo "Production state=${state:-pending}"
              if [ "$state" = failure ] || [ "$state" = error ]; then exit 1; fi
              if [ "$state" = success ]; then exit 0; fi
            fi
            sleep 5
          done
          exit 1

      - name: Verify source authority and recommendation neutrality
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const {products,categories,pathways}=require('./data');
          const {brands,pairPages,indexableRoutes}=require('./lib/routes');
          const {direct}=require('./data/retailers-v6');
          const {publicDecision}=require('./lib/decision-engine-v4');
          const metrics={products:products.length,categories:Object.keys(categories).length,emptyPathways:pathways.filter(p=>!p.maintained).length,brands:brands.length,comparisons:pairPages.length,indexableRoutes:indexableRoutes.length,directAmazon:Object.keys(direct).length};
          if(metrics.products<460)throw new Error(`product coverage regression ${metrics.products}`);
          if(metrics.categories<90)throw new Error(`category coverage regression ${metrics.categories}`);
          if(metrics.emptyPathways!==0||pathways.length!==metrics.categories)throw new Error(`pathway/category integrity ${pathways.length}/${metrics.categories}/${metrics.emptyPathways}`);
          if(metrics.brands<170)throw new Error(`brand coverage regression ${metrics.brands}`);
          if(metrics.comparisons<210)throw new Error(`comparison coverage regression ${metrics.comparisons}`);
          if(metrics.indexableRoutes<1200)throw new Error(`indexable route regression ${metrics.indexableRoutes}`);
          if(metrics.directAmazon<20)throw new Error(`exact Amazon coverage regression ${metrics.directAmazon}`);
          if(!indexableRoutes.includes('/decision-lab/'))throw new Error('clean Decision Lab missing from indexable routes');
          const decision=publicDecision('mesh wifi for a large home with ethernet');
          if(decision.commercialRecommendationWeight!==0)throw new Error('commercial recommendation weight must remain zero');
          const source=fs.readFileSync('./lib/decision-engine-v4.js','utf8');
          const score=source.slice(source.indexOf('function scoreProduct'),source.indexOf('function confidence'));
          if(/\bp\.(?:retailers?|affiliate|commission|asin)\b/i.test(score))throw new Error('commercial product field leaked into recommendation scoring');
          if(/require\([^)]*retailer/i.test(source))throw new Error('decision engine must not import retailer data');
          console.log('SOURCE_AUTHORITY='+JSON.stringify(metrics));
          console.log('COMMERCIAL_RECOMMENDATION_WEIGHT=0');
          NODE

      - name: Verify public shell and core routes
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/" -o /tmp/home.html
          for t in 'Australian Product Guide' 'data-platform-v7="true"' 'data-platform-v5="true"' 'Decision Lab' 'Buying guides' 'My Australian Product Guide' 'How recommendations work' 'href="/sitemap/"'; do grep -qi "$t" /tmp/home.html || { echo "Missing homepage contract: $t"; exit 1; }; done
          test "$(grep -o 'data-platform-v7="true"' /tmp/home.html | wc -l)" = 1
          for p in /categories/ /compare/ /guides/ /retailers/ /brands/ /decision-lab/ /my-apg/ /sitemap/; do code=$(curl -sSL -o /tmp/x -w '%{http_code}' "$BASE_URL$p"); test "$code" = 200 || { echo "$p returned $code"; exit 1; }; done
          curl -fsSL "$BASE_URL/decision-lab/" -o /tmp/clean-lab
          grep -q 'Decision Engine v4' /tmp/clean-lab
          grep -q 'data-platform-v7="true"' /tmp/clean-lab
          ! grep -q 'class="decision-result' /tmp/clean-lab
          echo 'PUBLIC_SHELL=PASS'

      - name: Verify public assets and catalogue export contract
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/assets/app.js" -o /tmp/app.js
          node --check /tmp/app.js
          count=$(curl -fsSL "$BASE_URL/assets/search-index.json" | jq 'length'); test "$count" -ge 550 || { echo "search index too small: $count"; exit 1; }
          curl -fsSL "$BASE_URL/api/catalogue.json" -o /tmp/catalogue.json
          curl -fsSL "$BASE_URL/api/catalogue.csv" -o /tmp/catalogue.csv
          node - <<'NODE'
          const fs=require('fs');
          const live=require('/tmp/catalogue.json');
          const source=require('./lib/catalogue-export').catalogueJson();
          const {products,categories}=require('./data');
          const {brands}=require('./lib/routes');
          const {direct}=require('./data/retailers-v6');
          if(JSON.stringify(live)!==JSON.stringify(source))throw new Error('Live catalogue JSON does not match checked-out exact-SHA exporter');
          if(live.version!=='platform-v7-amazon-associates')throw new Error(`version ${live.version}`);
          if(live.generatedFrom!=='GitHub-maintained runtime catalogue')throw new Error(`generatedFrom ${live.generatedFrom}`);
          if(live.commercialRecommendationWeight!==0)throw new Error('catalogue commercialRecommendationWeight must remain zero');
          if(live.affiliateUrlsExported!==false)throw new Error('catalogue must not export affiliate URLs');
          if(live.productCount!==products.length||live.categoryCount!==Object.keys(categories).length)throw new Error(`catalogue/source counts ${live.productCount}/${live.categoryCount} vs ${products.length}/${Object.keys(categories).length}`);
          if(live.brandCount!==brands.length)throw new Error(`canonical brand count ${live.brandCount}/${brands.length}`);
          if(Number(live.amazon?.exactVerified||0)!==Object.keys(direct).length)throw new Error(`exact Amazon count ${live.amazon?.exactVerified}/${Object.keys(direct).length}`);
          if(!Array.isArray(live.products)||live.products.length!==live.productCount)throw new Error(`product export length ${live.products?.length}`);
          const amazonTotal=Number(live.amazon?.exactVerified||0)+Number(live.amazon?.confirmedUnavailable||0)+Number(live.amazon?.furtherVerificationRequired||0);
          if(amazonTotal!==live.productCount)throw new Error(`Amazon status coverage ${amazonTotal}/${live.productCount}`);
          const csv=fs.readFileSync('/tmp/catalogue.csv','utf8').trimEnd().split('\n');
          if(csv.length!==live.productCount+1)throw new Error(`catalogue CSV lines ${csv.length}/${live.productCount+1}`);
          console.log(`CATALOGUE_EXPORT=PASS products=${live.productCount} categories=${live.categoryCount} brands=${live.brandCount}`);
          NODE
          curl -fsSI "$BASE_URL/api/catalogue.json" | tr -d '\r' | grep -qi '^cache-control:.*no-store'

      - name: Crawl all canonical indexable routes
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/sitemap.xml" -o /tmp/sitemap.xml
          BASE_URL="$BASE_URL" node - <<'NODE'
          const fs=require('fs'),{indexableRoutes}=require('./lib/routes'),base=process.env.BASE_URL;
          const xml=fs.readFileSync('/tmp/sitemap.xml','utf8');
          if(/<lastmod>/i.test(xml))throw new Error('sitemap contains blanket/synthetic lastmod');
          const urls=[...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map(x=>x[1]);
          if(urls.length!==indexableRoutes.length||new Set(urls).size!==indexableRoutes.length)throw new Error(`sitemap/source route count ${urls.length}/${indexableRoutes.length}`);
          const expected=new Set(indexableRoutes.map(p=>base+p));for(const u of urls)if(!expected.has(u))throw new Error(`unexpected ${u}`);
          let next=0,done=0;const bad=[];
          async function worker(){while(next<urls.length){const u=urls[next++],path=new URL(u).pathname;try{const r=await fetch(u),t=await r.text();if(r.status!==200)throw new Error(`HTTP ${r.status}`);if(!t.includes(`<link rel="canonical" href="${base+path}"`))throw new Error('canonical');if(/noindex/i.test((t.match(/<meta name="robots"[^>]*>/i)||[''])[0]))throw new Error('noindex');if(!t.includes('data-platform-v7="true"'))throw new Error('v7 marker');}catch(e){bad.push(`${path}: ${e.message}`)}done++;}}
          Promise.all(Array.from({length:16},worker)).then(()=>{if(bad.length){console.error(bad.slice(0,30).join('\n'));process.exit(1)}console.log(`CANONICAL_CRAWL=${done}/${indexableRoutes.length}_PASS`)});
          NODE

      - name: Verify every product route, Amazon attribution and freshness
        run: |
          set -euo pipefail
          BASE_URL="$BASE_URL" node - <<'NODE'
          const {products}=require('./data'),{direct}=require('./data/retailers-v6'),base=process.env.BASE_URL;let next=0,d=0,f=0;const bad=[];
          const expectedDirect=products.filter(p=>p.retailers?.[0]?.kind==='affiliate-direct').length,expectedFallback=products.length-expectedDirect;
          async function worker(){while(next<products.length){const p=products[next++];try{const r=await fetch(`${base}/products/${p.slug}/`),t=await r.text();if(r.status!==200)throw new Error(`HTTP ${r.status}`);for(const needle of ['auproductguid-22','rel="sponsored nofollow noopener"','"@type":"Product"','"@type":"BreadcrumbList"','Evidence freshness','Commercial score','data-product-category='])if(!t.includes(needle))throw new Error(`missing ${needle}`);const rr=p.retailers[0];if(rr.kind==='affiliate-direct'){d++;if(!rr.asin||!t.includes(rr.asin))throw new Error(`ASIN ${rr.asin||'missing'}`)}else f++;if(p.evidenceTier==='starter'&&!t.includes('Starter evidence'))throw new Error('starter disclosure');}catch(e){bad.push(`${p.slug}: ${e.message}`)}}}
          Promise.all(Array.from({length:12},worker)).then(()=>{if(bad.length){console.error(bad.slice(0,30).join('\n'));process.exit(1)}if(d!==expectedDirect||f!==expectedFallback)throw new Error(`retailer kinds ${d}/${f}`);if(Object.keys(direct).length!==expectedDirect)throw new Error(`direct registry ${Object.keys(direct).length}/${expectedDirect}`);console.log(`PRODUCT_ROUTES=${products.length}/${products.length}_PASS direct=${d} fallback=${f}`);});
          NODE

      - name: Representative journeys, v4 search and privacy boundaries
        run: |
          set -euo pipefail
          check(){ code=$(curl -sSL -o /tmp/page -w '%{http_code}' "$BASE_URL$1"); test "$code" = 200 || { echo "$1 returned $code"; exit 1; }; grep -qi "$2" /tmp/page || { echo "$1 missing $2"; exit 1; }; }
          check '/categories/coffee-machines/' 'Deep evidence'
          check '/categories/home-security-cameras/' 'Starter evidence'
          check '/products/tp-link-tapo-c500/' 'Evidence freshness'
          check '/categories/office-chairs/finder/?priority=ergonomic&secondary=lumbar' 'Best match'
          check '/decision-lab/?q=mesh+wifi+for+a+large+home+with+ethernet' 'Decision Engine v4'
          check '/my-apg/' 'Cross-device sync when signed in'
          check '/sitemap/' 'canonical indexable routes.'
          curl -fsSL "$BASE_URL/search/?q=laptop+for+uni" -o /tmp/laptop-search
          grep -qi 'Laptops' /tmp/laptop-search; grep -qi 'relevant maintained products' /tmp/laptop-search; ! grep -qi 'Coverage gap' /tmp/laptop-search
          curl -fsSL "$BASE_URL/search/?q=quiet+dishwasher+under+1000" -o /tmp/dishwasher-search
          grep -qi '5 relevant maintained products' /tmp/dishwasher-search; grep -q '/categories/dishwashers/' /tmp/dishwasher-search; ! grep -q 'sony-wh-1000xm6-vs-bose-quietcomfort-ultra-headphones' /tmp/dishwasher-search
          curl -fsSL "$BASE_URL/search/?q=TV+must+be+exactly+999+inches" -o /tmp/strict-search
          grep -q 'No maintained product can currently be verified against every hard constraint' /tmp/strict-search; ! grep -q 'class="product-card' /tmp/strict-search
          curl -fsSL "$BASE_URL/compare/custom/?products=sony-wh-1000xm6,bose-quietcomfort-ultra-headphones" -o /tmp/diff
          grep -qi 'Difference Engine' /tmp/diff; grep -qi 'biggest difference' /tmp/diff; grep -qi 'Verify before buying' /tmp/diff
          for p in /about/ /privacy/ /terms/ /methodology/ /editorial-standards/ /sources/ /coverage/ /updates/ /affiliate-disclosure/ /contact/; do check "$p" 'Australian Product Guide'; done
          echo 'REPRESENTATIVE_JOURNEYS=PASS'
