name: APG Production Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://au-product-guide.vercel.app
    steps:
      - name: Wait for Vercel Production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            deployments=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA")
            deployment_id=$(echo "$deployments" | jq -r '.[0].id // empty')
            if [ -n "$deployment_id" ]; then
              statuses=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments/$deployment_id/statuses")
              state=$(echo "$statuses" | jq -r '.[0].state // empty')
              url=$(echo "$statuses" | jq -r '.[0].environment_url // .[0].target_url // empty')
              echo "Vercel state: ${state:-pending}"
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then exit 1; fi
              if [ "$state" = "success" ]; then
                echo "Immutable deployment URL: ${url:-unknown}"
                echo "Clean Production alias: $BASE_URL"
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1

      - name: Verify public homepage system routes and assets
        run: |
          set -euo pipefail
          code=$(curl -sS -L -D /tmp/home.headers -o /tmp/home.html -w '%{http_code}' "$BASE_URL/")
          echo "Homepage HTTP: $code"
          test "$code" = "200"
          grep -qi '<title>Australian Product Guide' /tmp/home.html
          grep -q 'rel="canonical" href="https://au-product-guide.vercel.app/"' /tmp/home.html
          if grep -qiE 'authentication required|vercel authentication|log in to vercel|sign in to vercel|Login – Vercel' /tmp/home.html; then exit 1; fi
          for asset in /assets/site.css /assets/logo.svg /assets/social.svg; do
            code=$(curl -sS -L -o /tmp/asset -w '%{http_code}' "$BASE_URL$asset")
            echo "$asset HTTP: $code"
            test "$code" = "200"
          done
          curl -fsSL "$BASE_URL/assets/site.css" -o /tmp/site.css
          grep -q '@media(max-width:800px)' /tmp/site.css
          grep -q 'name="viewport"' /tmp/home.html
          code=$(curl -sS -L -o /tmp/sitemap.xml -w '%{http_code}' "$BASE_URL/sitemap.xml")
          echo "Sitemap HTTP: $code"
          test "$code" = "200"
          grep -qi '<urlset' /tmp/sitemap.xml
          code=$(curl -sS -L -o /tmp/robots.txt -w '%{http_code}' "$BASE_URL/robots.txt")
          echo "Robots HTTP: $code"
          test "$code" = "200"
          grep -q 'Sitemap: https://au-product-guide.vercel.app/sitemap.xml' /tmp/robots.txt
          code=$(curl -sS -o /tmp/notfound.html -w '%{http_code}' "$BASE_URL/__apg-p0-genuine-404-test__/")
          echo "404 test HTTP: $code"
          test "$code" = "404"
          grep -qi 'Page not found' /tmp/notfound.html
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL/coffee-machines")
          location=$(curl -sSI "$BASE_URL/coffee-machines" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1}/^location:/{print $2; exit}')
          echo "Legacy coffee route HTTP: $code Location: $location"
          test "$code" = "308"
          test "$location" = "/categories/coffee-machines/"

      - name: Crawl every canonical indexable route
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,urllib.parse,urllib.request
          base=os.environ['BASE_URL']
          xml=open('/tmp/sitemap.xml',encoding='utf-8').read()
          urls=re.findall(r'<loc>(.*?)</loc>',xml,re.I)
          print('SITEMAP_URL_COUNT='+str(len(urls)))
          if len(urls)!=137: raise SystemExit(f'Expected 137 sitemap URLs, found {len(urls)}')
          if len(set(urls))!=137: raise SystemExit('Duplicate sitemap URLs')
          for u in urls:
              if not u.startswith(base+'/') and u!=base+'/': raise SystemExit('Non-Production sitemap hostname: '+u)
              p=urllib.parse.urlsplit(u).path
              req=urllib.request.Request(base+p,headers={'User-Agent':'APG-P0-Full-Crawl/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  if r.status!=200: raise SystemExit(f'{p} returned {r.status}')
                  text=r.read().decode('utf-8','replace')
              expected=base+p
              m=re.search(r'<link rel="canonical" href="([^"]+)"',text,re.I)
              if not m or m.group(1)!=expected: raise SystemExit(f'Bad canonical {p}: {m.group(1) if m else "missing"}')
              if re.search(r'<meta name="robots" content="noindex',text,re.I): raise SystemExit('Indexable route is noindex: '+p)
              if 'australian-tradie-software-matcher' in text.lower() or 'australian tradie software matcher' in text.lower(): raise SystemExit('Tradie contamination: '+p)
              if '<title>' not in text.lower(): raise SystemExit('Missing title: '+p)
          print('FULL_INDEXABLE_CRAWL=137/137_HTTP_200')
          print('CANONICALS=137/137_PRODUCTION_HOST')
          print('INDEXABLE_NOINDEX_ERRORS=0')
          print('TRADIE_CONTAMINATION=ABSENT_ALL_INDEXABLE_ROUTES')
          PY

      - name: Verify route families search and finders
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,urllib.parse
          xml=open('/tmp/sitemap.xml',encoding='utf-8').read()
          urls=re.findall(r'<loc>(.*?)</loc>',xml,re.I)
          paths=[urllib.parse.urlsplit(u).path for u in urls]
          counts={'products':sum(p.startswith('/products/') for p in paths),'finders':sum(p.endswith('/finder/') for p in paths),'guides':sum(p.startswith('/guides/') for p in paths),'comparisons':sum(p.startswith('/compare/') for p in paths),'brands':sum(p.startswith('/brands/') and p!='/brands/' for p in paths)}
          print('ROUTE_FAMILY_COUNTS='+str(counts))
          expected={'products':37,'finders':4,'guides':4,'comparisons':60,'brands':16}
          if counts!=expected: raise SystemExit(f'Unexpected route family counts {counts}')
          PY
          code=$(curl -sS -L -o /tmp/search.html -w '%{http_code}' "$BASE_URL/search/?q=Breville")
          echo "Search HTTP: $code"
          test "$code" = "200"
          grep -qi 'Breville' /tmp/search.html
          grep -qi 'noindex,follow' /tmp/search.html
          code=$(curl -sS -L -o /tmp/airfinder.html -w '%{http_code}' "$BASE_URL/categories/air-fryers/finder/?priority=dual-zone")
          echo "Air-fryer finder HTTP: $code"
          test "$code" = "200"
          grep -qi 'Best fit' /tmp/airfinder.html
          for path in /about/ /methodology/ /editorial-standards/ /sources/ /corrections-policy/ /affiliate-disclosure/ /privacy/ /terms/ /contact/; do
            code=$(curl -sS -L -o /tmp/trust.html -w '%{http_code}' "$BASE_URL$path")
            echo "$path HTTP: $code"
            test "$code" = "200"
          done

      - name: Verify seven coffee matcher regression profiles
        run: |
          set -euo pipefail
          check_profile(){
            id="$1"; query="$2"; expected="$3"
            code=$(curl -sS -L -o "/tmp/$id.html" -w '%{http_code}' "$BASE_URL/categories/coffee-machines/finder/?$query")
            echo "$id HTTP: $code Expected: $expected"
            test "$code" = "200"
            grep -qi 'Best fit' "/tmp/$id.html"
            grep -qi "$expected" "/tmp/$id.html"
          }
          check_profile QA001 'workflow=one-touch&drink=milk&learning=almost&budget=1500&speed=high&space=normal&beans=rarely' 'Magnifica Start with Milk'
          check_profile QA002 'workflow=guided&drink=milk&learning=some&budget=2000&speed=medium&space=normal&beans=sometimes' 'Barista Touch BES880'
          check_profile QA003 'workflow=guided&drink=black&learning=some&budget=700&speed=medium&space=normal&beans=rarely' 'Sunbeam Barista Max'
          check_profile QA004 'workflow=manual&drink=mixed&learning=control&budget=1500&speed=low&space=any&beans=often' 'La Specialista Opera'
          check_profile QA005 'workflow=one-touch&drink=mixed&learning=almost&budget=1500&speed=high&space=compact&beans=sometimes' 'Magnifica Evo'
          check_profile QA006 'workflow=guided&drink=cold&learning=some&budget=2000&speed=medium&space=normal&beans=rarely' 'Barista Touch Impress'
          check_profile QA007 'workflow=one-touch&drink=mixed&learning=almost&budget=1500&speed=high&space=normal&beans=often' 'Rivelia Auto Milk'
          echo 'COFFEE_MATCHER_QA=7/7_PASS'

      - name: Verify product affiliate and structured-data controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,urllib.parse,urllib.request
          base=os.environ['BASE_URL']
          xml=open('/tmp/sitemap.xml',encoding='utf-8').read()
          urls=re.findall(r'<loc>(.*?)</loc>',xml,re.I)
          products=[urllib.parse.urlsplit(u).path for u in urls if '/products/' in u]
          if len(products)!=37: raise SystemExit('Expected 37 product routes')
          for p in products:
              req=urllib.request.Request(base+p,headers={'User-Agent':'APG-P0-Affiliate-QA/1.0'})
              text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              if 'auproductguid-22' not in text: raise SystemExit('Missing affiliate tag: '+p)
              if 'rel="sponsored nofollow noopener"' not in text: raise SystemExit('Missing sponsored rel: '+p)
              if 'Paid link.' not in text: raise SystemExit('Missing paid-link label: '+p)
              if '"@type":"Product"' not in text: raise SystemExit('Missing Product schema: '+p)
              if '"@type":"BreadcrumbList"' not in text: raise SystemExit('Missing Breadcrumb schema: '+p)
          print('PRODUCT_AFFILIATE_CONTROLS=37/37_PASS')
          print('PRODUCT_SCHEMA=37/37_PASS')
          PY
          curl -fsSL "$BASE_URL/affiliate-disclosure/" -o /tmp/disclosure.html
          grep -q 'As an Amazon Associate' /tmp/disclosure.html
          grep -q 'auproductguid-22' /tmp/disclosure.html
          echo 'AFFILIATE_DISCLOSURE=PASS'
