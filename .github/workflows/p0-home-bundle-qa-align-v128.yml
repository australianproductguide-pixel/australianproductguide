name: APG P0 Home bundle QA alignment v128

on:
  push:
    branches:
      - release/p0-home-bundle-source-v1282

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/p0-home-bundle-source-v1282
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Align premium QA with the signed v128 Home bundle path
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const file='scripts/premium-experience-v107-qa.js';
          const source=fs.readFileSync(file,'utf8');
          const oldLine="    const premiumCssDelivered=response.body.includes(premium.CSS_PATH)||(route==='/'&&response.body.includes('/assets/pagespeed-home-v113.css'));";
          const newText="    // Home v128 replaces direct stylesheet links only after exact signature validation.\n    const premiumCssDelivered=response.body.includes(premium.CSS_PATH)||(route==='/'&&response.body.includes('/assets/home-v128-bundle.css'));";
          const matches=source.split(oldLine).length-1;
          if(matches!==1)throw new Error(`expected one historical Home bundle assertion, found ${matches}`);
          fs.writeFileSync(file,source.replace(oldLine,newText));
          NODE
          node --check scripts/premium-experience-v107-qa.js
          npm install --ignore-scripts --package-lock=false --no-audit --no-fund
          node scripts/premium-experience-v107-qa.js
      - name: Commit the focused QA alignment and remove this temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/premium-experience-v107-qa.js
          git rm .github/workflows/p0-home-bundle-qa-align-v128.yml
          changed=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n%s' '.github/workflows/p0-home-bundle-qa-align-v128.yml' 'scripts/premium-experience-v107-qa.js')
          test "$changed" = "$expected"
          git commit -m 'Recognise the signed v128 Home bundle in premium QA'
          git push origin HEAD:release/p0-home-bundle-source-v1282
