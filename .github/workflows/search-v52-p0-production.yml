name: APG Search v52 P0 Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: write

concurrency:
  group: apg-search-v52-p0-verification
  cancel-in-progress: true

jobs:
  search-v52-p0-production:
    name: Search v52 P0 Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://australianproductguide.au
      OUTPUT_DIR: artifacts/search-v52-p0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Wait for exact Vercel Production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ready=
          for attempt in $(seq 1 120); do
            deployments=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA")
            id=$(echo "$deployments" | jq -r '[.[]|select(.environment=="Production" or .original_environment=="Production")][0].id//empty')
            if [ -n "$id" ]; then
              statuses=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments/$id/statuses")
              state=$(echo "$statuses" | jq -r '.[0].state//empty')
              echo "Search v52 Production state=${state:-pending}"
              if [ "$state" = failure ] || [ "$state" = error ]; then exit 1; fi
              if [ "$state" = success ]; then ready=1; break; fi
            fi
            sleep 5
          done
          if [ -z "$ready" ]; then
            echo 'Timed out waiting for exact Search v52 Production deployment'
            exit 1
          fi
          short=$(printf '%s' "$SHA" | cut -c1-16)
          for attempt in $(seq 1 30); do
            if curl -fsSL "$BASE_URL/" -o /tmp/search-home-sha.html && grep -q "v=$short" /tmp/search-home-sha.html; then
              echo "Canonical Production exposes commit marker $short"
              exit 0
            fi
            echo "Waiting for canonical hostname to expose $short (attempt $attempt/30)"
            sleep 5
          done
          echo 'Canonical Production did not expose the exact Search v52 commit'
          exit 1

      - name: Verify public Search v52 contracts
        run: |
          set -euo pipefail
          curl -fsSL -D /tmp/search-v52.headers "$BASE_URL/assets/search-reliability-v52.js?v=52.0" -o /tmp/search-v52.js
          tr -d '\r' < /tmp/search-v52.headers | grep -qi '^x-apg-search-reliability: search-p0-2026-08-20-isolated-json-r3'
          grep -q 'window.__APG_SEARCH_RELIABILITY_V52__' /tmp/search-v52.js
          ! grep -q 'location.assign(' /tmp/search-v52.js
          ! grep -q 'scrollIntoView(' /tmp/search-v52.js
          curl -fsSL -D /tmp/sony.headers "$BASE_URL/search/?q=sony%20xm6" -o /tmp/sony.html
          tr -d '\r' < /tmp/sony.headers | grep -qi '^x-apg-search-reliability: search-p0-2026-08-20-isolated-json-r3'
          grep -q '/assets/search-reliability-v52.js?v=52.0' /tmp/sony.html
          grep -Eq 'WH-1000XM6|Sony' /tmp/sony.html
          grep -q 'Affiliate availability and commission contribute zero recommendation points.' /tmp/sony.html

      - name: Install browser diagnostic dependency
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium is unavailable on the runner'
            exit 1
          fi
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null 2>&1

      - name: Certify Search v52 real-browser journeys
        run: |
          set -euo pipefail
          node scripts/search-v52-p0-browser-diagnostic.js
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/search-v52-p0/report.json','utf8'));
          if(!r.ok)throw new Error('Search v52 report is not clean: '+JSON.stringify(r,null,2));
          if(r.browserErrors?.length)throw new Error('Search v52 browser errors: '+JSON.stringify(r.browserErrors));
          const required=[
            'desktop-normal-search-submit',
            'desktop-model-search-sony-xm6',
            'desktop-previous-search-sony-xm6',
            'desktop-recent-object-migration',
            'desktop-recent-keyboard-enter',
            'desktop-repeated-search-and-back',
            'desktop-zero-result-bounded',
            'mobile-previous-search-click',
            'desktop-direct-sony-xm6',
            'desktop-duplicate-submit-single-fetch',
            'desktop-http-error-recovery',
            'desktop-forced-timeout-recovery'
          ];
          for(const name of required)if(!r.journeys?.some(x=>x.name===name&&x.ok))throw new Error('Missing passing Search v52 journey: '+name);
          console.log('Search v52 exact Production browser certification is clean');
          NODE

      - name: Upload Search v52 P0 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apg-search-v52-p0-${{ github.run_id }}
          path: artifacts/search-v52-p0
          retention-days: 30
          if-no-files-found: warn

      - name: Publish Search v52 P0 verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          if [ "$JOB_STATUS" != success ]; then state=failure; fi
          payload=$(jq -n --arg state "$state" --arg context 'Search v52 P0 Verification' --arg description "Search v52 Production: $JOB_STATUS" --arg target_url "https://github.com/$REPO/actions/runs/$RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload" >/dev/null
