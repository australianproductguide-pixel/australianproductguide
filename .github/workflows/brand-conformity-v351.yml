name: APG Brand Conformity v35.1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify v35.1 edge-surface contract
        run: |
          set -euo pipefail
          node --check lib/brand-conformity-v351.js
          node --check scripts/brand-conformity-v351-qa.js
          node scripts/brand-conformity-v351-qa.js
          grep -q "brand-conformity-v351" api/index.js
