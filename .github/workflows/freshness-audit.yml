name: APG freshness audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate maintained catalogue freshness and model identity
        run: node scripts/freshness-audit.js
