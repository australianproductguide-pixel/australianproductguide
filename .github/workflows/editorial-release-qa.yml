name: APG Editorial Release QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [editorial-compliance-release-v14-20260817]

permissions:
  contents: read

jobs:
  editorial-release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check lib/editorial-compliance.js
          node --check scripts/editorial-compliance-qa.js
          node --check scripts/rendered-route-qa.js
      - name: Editorial compliance regression
        run: node scripts/editorial-compliance-qa.js
      - name: Representative server-rendered route QA
        run: node scripts/rendered-route-qa.js
