name: APG Brand Fidelity v32.5.2 Mobile Visual

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: write

jobs:
  mobile-menu-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://australianproductguide.au
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact Production SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA" >/tmp/v325-deployments.json
            id=$(jq -r '[.[]|select(.environment=="Production" or .original_environment=="Production")][0].id//empty' /tmp/v325-deployments.json)
            if [ -n "$id" ]; then
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments/$id/statuses" >/tmp/v325-statuses.json
              state=$(jq -r '.[0].state//empty' /tmp/v325-statuses.json)
              [ "$state" = failure ] || [ "$state" = error ] && exit 1
              [ "$state" = success ] && exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify v32.5.2 public contract and semantic mobile destination count
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/" >/tmp/v325-home.html
          grep -q 'data-brand-fidelity-v325="true"' /tmp/v325-home.html
          grep -q 'apg-v325-decision-mobile' /tmp/v325-home.html
          grep -q 'apg-v325-scout-mobile' /tmp/v325-home.html
          grep -q '/assets/brand-fidelity-v325.css?v=32.5.2' /tmp/v325-home.html
          grep -q '/assets/brand-fidelity-v325.js?v=32.5.2' /tmp/v325-home.html
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/v325-home.html','utf8');
          const nav=(html.match(/<nav\b[^>]*\bid="mobileNav"[^>]*>[\s\S]*?<\/nav>/i)||[])[0]||'';
          if(!nav)throw new Error('mobileNav SSR block missing');
          const decisionCount=(nav.match(/href="\/decision-lab\/"/g)||[]).length;
          if(decisionCount!==1)throw new Error(`expected exactly one SSR mobile Decision Lab destination, found ${decisionCount}`);
          if(!/class="[^"]*apg-v325-decision-mobile[^"]*"[^>]*href="\/decision-lab\/"/.test(nav)&&!/href="\/decision-lab\/"[^>]*class="[^"]*apg-v325-decision-mobile/.test(nav))throw new Error('sole mobile Decision Lab destination is not the approved primary control');
          if(!nav.includes('apg-v325-scout-mobile'))throw new Error('approved mobile Ask Scout control missing');
          NODE
          curl -fsSL "$BASE_URL/assets/brand-fidelity-v325.css?v=32.5.2" >/tmp/v325.css
          curl -fsSL "$BASE_URL/assets/brand-fidelity-v325.js?v=32.5.2" >/tmp/v325.js
          grep -q 'content:"Ask Scout"' /tmp/v325.css
          grep -q 'content:"Decision Lab"' /tmp/v325.css
          grep -q 'a\[href="/decision-lab/"\]:not(.apg-v325-decision-mobile)' /tmp/v325.css
          ! grep -q 'MutationObserver' /tmp/v325.js
          grep -q ':scope > a\[href="/decision-lab/"\]' /tmp/v325.js
          curl -fsSL "$BASE_URL/api/intelligence/observability" >/tmp/v325-observability.json
          jq -e '.catalogue.products > 0 and .catalogue.categories > 0 and .catalogue.brands > 0 and .recommendation.affiliateRecommendationWeight == 0 and .releaseGate.pass == true' /tmp/v325-observability.json >/dev/null
      - name: Render stable tablet and mobile menu
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null 2>&1
          mkdir -p visual-v325
          CHROME="$CHROME" BASE_URL="$BASE_URL" VISUAL_OUT=visual-v325 node scripts/brand-fidelity-v325-menu-production.js
      - name: Confirm main remained on certified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/commits/main" | jq -r '.sha')
          test "$current" = "$SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apg-v3252-mobile-visual-${{ github.run_id }}
          path: visual-v325
          retention-days: 30
          if-no-files-found: warn
      - name: Publish v32.5.2 mobile visual status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success; [ "$JOB_STATUS" = success ] || state=failure
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$(jq -n --arg state "$state" --arg context 'APG v32.5.2 Mobile Visual Certification' --arg description "v32.5.2 one-destination mobile visual: $JOB_STATUS" --arg target_url "https://github.com/$REPO/actions/runs/$RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
