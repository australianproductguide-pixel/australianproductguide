name: APG Account Sync QA

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify account sync modules and privacy controls
        run: |
          set -euo pipefail
          node --check lib/account-sync-client.js
          node --check lib/account-policy.js
          node --check lib/app.js
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('lib/app.js','utf8');
          const sync=fs.readFileSync('lib/account-sync-client.js','utf8');
          const policy=fs.readFileSync('lib/account-policy.js','utf8');
          for(const required of ['apg_workspace_items','/auth/v1/token?grant_type=password','/auth/v1/signup','/functions/v1/delete-account']) if(!sync.includes(required)) throw new Error('missing sync control '+required);
          if(!app.includes('gozovvhofdsshjuixcys.supabase.co')) throw new Error('Supabase CSP endpoint missing');
          if(!app.includes('accountSyncClientJs')) throw new Error('account bundle missing');
          if(!policy.includes('optional My APG account')||!policy.includes('Delete account')) throw new Error('privacy/terms update missing');
          if(/SERVICE_ROLE|service_role/.test(sync)) throw new Error('service-role material must never reach browser code');
          console.log('ACCOUNT_SYNC_SOURCE=PASS');
          NODE
