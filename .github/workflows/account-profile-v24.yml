name: My APG account profile v24 QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  account-profile-v24:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check lib/account-profile-v24.js
          node --check public/assets/account-profile-v24.js
          node --check scripts/account-profile-v24-qa.js
      - name: Run profile regression QA
        run: node scripts/account-profile-v24-qa.js
