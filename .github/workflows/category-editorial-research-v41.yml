name: APG Category Editorial Research v44

on:
  push:
    branches:
      - apg-category-editorial-images-v44
    paths:
      - scripts/category-editorial-research-v44.js
      - .github/workflows/category-editorial-research-v41.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: apg-category-editorial-images-v44
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Research licensed Wikimedia Commons category imagery
        run: node scripts/category-editorial-research-v44.js || test -f data/category-editorial-selected-v44.json
      - name: Commit candidate and selected registers to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/category-editorial-candidates-v44.json data/category-editorial-selected-v44.json
          if git diff --cached --quiet; then
            echo "Editorial image registers unchanged"
          else
            git commit -m "Generate Wikimedia category editorial image register v44 [skip ci]"
            git push origin HEAD:apg-category-editorial-images-v44
          fi
