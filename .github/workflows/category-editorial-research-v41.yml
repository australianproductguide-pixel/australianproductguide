name: APG Category Editorial Research

on:
  push:
    branches:
      - main
      - apg-category-editorial-research-v42-main
      - apg-category-editorial-images-v44
    paths:
      - scripts/category-editorial-research-v42.js
      - scripts/category-editorial-research-v44.js
      - scripts/category-editorial-review-v44.js
      - scripts/category-editorial-materialise-v44.js
      - .github/workflows/category-editorial-research-v41.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apg-category-editorial-research-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Research and materialise category imagery
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "apg-category-editorial-images-v44" ]; then
            node scripts/category-editorial-research-v44.js || test -f data/category-editorial-selected-v44.json
            node scripts/category-editorial-review-v44.js || test -f data/category-editorial-review-v44.md
            node scripts/category-editorial-materialise-v44.js
          else
            node scripts/category-editorial-research-v42.js
          fi
      - name: Publish research and materialised assets to source branch
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          if [ "$branch" = "apg-category-editorial-images-v44" ]; then
            files='data/category-editorial-candidates-v44.json data/category-editorial-selected-v44.json data/category-editorial-review-v44.md data/category-editorial-images-v44.js data/category-editorial-final-review-v44.json lib/pages.js lib/premium-css.js'
            asset_dir='public/category-editorial'
            message='Materialise curated category editorial imagery v44 [skip ci]'
          else
            files='data/category-editorial-candidates-v42.json'
            asset_dir=''
            message='Generate category editorial image candidates v42 [skip ci]'
          fi
          snapshot="$(mktemp -d)"
          for candidate in $files; do
            mkdir -p "$snapshot/$(dirname "$candidate")"
            cp "$candidate" "$snapshot/$candidate"
          done
          if [ -n "$asset_dir" ]; then
            mkdir -p "$snapshot/public"
            cp -R "$asset_dir" "$snapshot/public/"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            for candidate in $files; do
              mkdir -p "$(dirname "$candidate")"
              cp "$snapshot/$candidate" "$candidate"
            done
            if [ -n "$asset_dir" ]; then
              rm -rf "$asset_dir"
              mkdir -p public
              cp -R "$snapshot/public/category-editorial" public/
            fi
            git add $files
            if [ -n "$asset_dir" ]; then git add "$asset_dir"; fi
            if git diff --cached --quiet; then
              echo "Editorial image output unchanged"
              exit 0
            fi
            git commit -m "$message"
            if git push origin "HEAD:$branch"; then
              echo "Editorial image output published on attempt $attempt"
              exit 0
            fi
            echo "Research branch advanced during publish; retrying from latest remote head"
          done
          echo 'Unable to publish editorial image output after 3 safe retries'
          exit 1
