name: APG Category Editorial Research v42

on:
  push:
    branches:
      - main
      - apg-category-editorial-research-v42-main
    paths:
      - scripts/category-editorial-research-v42.js
      - .github/workflows/category-editorial-research-v41.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/category-editorial-research-v42.js
      - .github/workflows/category-editorial-research-v41.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apg-category-editorial-research-v42
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: apg-category-editorial-research-v42-main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Research CC0 category imagery
        run: node scripts/category-editorial-research-v42.js
      - name: Publish candidate register to research branch
        run: |
          set -euo pipefail
          branch='apg-category-editorial-research-v42-main'
          candidate='data/category-editorial-candidates-v42.json'
          snapshot="$(mktemp)"
          cp "$candidate" "$snapshot"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            cp "$snapshot" "$candidate"
            git add "$candidate"
            if git diff --cached --quiet; then
              echo "Candidate register unchanged"
              exit 0
            fi
            git commit -m "Generate category editorial image candidates v42 [skip ci]"
            if git push origin "HEAD:$branch"; then
              echo "Candidate register published on attempt $attempt"
              exit 0
            fi
            echo "Research branch advanced during publish; retrying from the latest remote head"
          done
          echo 'Unable to publish the candidate register after 3 safe retries'
          exit 1
