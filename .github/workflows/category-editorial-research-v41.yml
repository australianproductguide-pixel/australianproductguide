name: APG Category Editorial Research v42

on:
  push:
    branches:
      - main
      - apg-category-editorial-research-v42-main
    paths:
      - scripts/category-editorial-research-v42.js
      - .github/workflows/category-editorial-research-v41.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/category-editorial-research-v42.js
      - .github/workflows/category-editorial-research-v41.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: apg-category-editorial-research-v42-main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Research CC0 category imagery
        run: node scripts/category-editorial-research-v42.js
      - name: Commit research outputs to dedicated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/category-editorial-candidates-v42.json data/category-editorial-selection-v43.json data/category-editorial-summary-v43.json
          if git diff --cached --quiet; then
            echo "Category editorial research outputs unchanged"
          else
            git commit -m "Generate refined category editorial image research v43 [skip ci]"
            git push origin HEAD:apg-category-editorial-research-v42-main
          fi
