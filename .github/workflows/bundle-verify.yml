name: APG Bundle Integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map corruption blocks between bundle copies
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/bundles.json
          const c=['c0','c1','c2','c3','c4','c5'].map(n=>require('./bundle/'+n)).join('');
          const s=['s0','s1','s2','g1','g2','g3'].map(n=>require('./bundle/'+n)).join('');
          process.stdout.write(JSON.stringify({c,s}));
          NODE
          python3 - <<'PY'
          import json,difflib
          d=json.load(open('/tmp/bundles.json'))
          C,S=d['c'],d['s']
          sm=difflib.SequenceMatcher(None,C,S,autojunk=False)
          blocks=[b for b in sm.get_matching_blocks() if b.size>=40]
          print('C_LEN',len(C),'S_LEN',len(S),'BLOCKS',len(blocks))
          for b in blocks:
              print(f'BLOCK C[{b.a}:{b.a+b.size}] S[{b.b}:{b.b+b.size}] LEN={b.size} DELTA={b.b-b.a}')
          print('OPCODES')
          for tag,a0,a1,b0,b1 in sm.get_opcodes():
              if tag!='equal' or a1-a0>=40:
                  print(tag,a0,a1,b0,b1,'alen',a1-a0,'blen',b1-b0)
          PY
