name: APG Bundle Integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map surviving bundle windows
        run: |
          set -euo pipefail
          node <<'NODE'
          const cn=['c0','c1','c2','c3','c4','c5'], sn=['s0','s1','s2','g1','g2','g3'];
          const cp=cn.map(n=>require('./bundle/'+n)), sp=sn.map(n=>require('./bundle/'+n));
          const C=cp.join(''), S=sp.join('');
          console.log('C_LEN='+C.length+' S_LEN='+S.length);
          function map(parts,names,hay,hayName){
            for(let k=0;k<parts.length;k++){
              const p=parts[k];
              let last=null;
              for(let off=0;off+500<=p.length;off+=500){
                const pos=hay.indexOf(p.slice(off,off+500));
                const key=pos>=0 ? `${hayName}:${pos-off}` : 'MISS';
                if(key!==last){console.log(`${names[k]} off=${off} -> ${key}`);last=key;}
              }
              const off=Math.max(0,p.length-500), pos=hay.indexOf(p.slice(off));
              console.log(`${names[k]} tail off=${off} -> ${pos>=0?hayName+':'+(pos-off):'MISS'}`);
            }
          }
          console.log('--- C chunks mapped into S ---'); map(cp,cn,S,'S');
          console.log('--- S chunks mapped into C ---'); map(sp,sn,C,'C');
          NODE
