name: APG Bundle Integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory recoverable site prefix
        run: |
          set -euo pipefail
          node <<'NODE'
          const z=require('zlib');
          const B=['s0','s1','s2','g1','g2','g3'].map(n=>require('./bundle/'+n)).join('');
          const buf=Buffer.from(B,'base64');
          const d=z.createBrotliDecompress();
          const out=[];
          d.on('data',x=>out.push(x));
          d.on('error',e=>{
            const raw=Buffer.concat(out).toString('utf8');
            console.log('RECOVERED_CHARS='+raw.length+' ERROR='+e.code);
            const keys=[...raw.matchAll(/(?:^|,)\"([^\"]+)\":\[/g)].map(m=>m[1]);
            console.log('RECOVERED_TOP_LEVEL_KEYS='+keys.length);
            keys.forEach((k,i)=>console.log('KEY '+i+' '+k));
            const productPaths=[...new Set([...raw.matchAll(/\\?\"(\/products\/[a-z0-9-]+\/)\\?\"/gi)].map(m=>m[1]))];
            console.log('PRODUCT_PATHS='+productPaths.length);
            productPaths.forEach(x=>console.log('PRODUCT '+x));
            const categoryPaths=[...new Set([...raw.matchAll(/\\?\"(\/categories\/[a-z0-9-]+\/)\\?\"/gi)].map(m=>m[1]))];
            console.log('CATEGORY_PATHS='+categoryPaths.length);
            categoryPaths.forEach(x=>console.log('CATEGORY '+x));
            console.log('TAIL='+JSON.stringify(raw.slice(-12000)));
          });
          for(let i=0;i<buf.length;i+=64)d.write(buf.subarray(i,i+64));
          d.end();
          NODE
