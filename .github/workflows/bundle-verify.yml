name: APG Bundle Integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rank splice candidates
        run: |
          set -euo pipefail
          node <<'NODE'
          const z=require('zlib');
          const C=['c0','c1','c2','c3','c4','c5'].map(n=>require('./bundle/'+n)).join('');
          const S=['s0','s1','s2','g1','g2','g3'].map(n=>require('./bundle/'+n)).join('');
          const common=[C.slice(0,9984),C.slice(10009,29990),C.slice(49880,53864),C.slice(61867,69848),C.slice(69871,71852),C.slice(81587,91584)];
          const dc=[C.slice(9984,10009),C.slice(29990,49880),C.slice(53864,61867),C.slice(69848,69871),C.slice(71852,81587)];
          const ds=[S.slice(9984,20003),S.slice(39984,62004),S.slice(65988,66011),S.slice(73992,84010),S.slice(85991,86014)];
          function candidate(mask){let B=common[0], choices='';for(let i=0;i<5;i++){const useS=!!(mask&(1<<i));B+=(useS?ds[i]:dc[i])+common[i+1];choices+=useS?'S':'C';}return {B,choices};}
          function recover(b64){return new Promise(resolve=>{const d=z.createBrotliDecompress(),out=[];let done=false;const finish=(ok,e)=>{if(done)return;done=true;resolve({chars:Buffer.concat(out).toString('utf8').length,ok,error:e||''});};d.on('data',x=>out.push(x));d.on('error',e=>finish(false,e.code));d.on('end',()=>finish(true,''));d.end(Buffer.from(b64,'base64'));});}
          (async()=>{const results=[];for(let mask=0;mask<32;mask++){const {B,choices}=candidate(mask);const r=await recover(B);results.push({choices,len:B.length,...r});}results.sort((a,b)=>b.chars-a.chars);results.forEach((r,i)=>console.log(`RANK=${i+1} CHOICES=${r.choices} OUTPUT=${r.chars} B64=${r.len} OK=${r.ok} ERROR=${r.error}`));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
