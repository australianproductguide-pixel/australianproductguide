name: APG Bundle Integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse surviving bundle overlap
        run: |
          set -euo pipefail
          node <<'NODE'
          const sets={
            c:['c0','c1','c2','c3','c4','c5'].map(n=>require('./bundle/'+n)),
            sg:['s0','s1','s2','g1','g2','g3'].map(n=>require('./bundle/'+n))
          };
          for(const [name,parts] of Object.entries(sets)){
            const full=parts.join('');
            console.log(name+'_total='+full.length);
            console.log(name+'_prefix='+JSON.stringify(full.slice(0,80)));
            console.log(name+'_suffix='+JSON.stringify(full.slice(-80)));
          }
          const C=sets.c.join(''), S=sets.sg.join('');
          console.log('same_prefix_chars='+(()=>{let i=0;while(i<C.length&&i<S.length&&C[i]===S[i])i++;return i})());
          function bestMatch(needle,hay){
            for(const len of [12000,10000,8000,6000,4000,2000,1000,500,200,100,50]){
              for(let off=0;off+len<=needle.length;off+=Math.max(1,Math.floor(len/2))){
                const sub=needle.slice(off,off+len), p=hay.indexOf(sub);
                if(p>=0)return {len,off,p};
              }
            }
            return null;
          }
          sets.c.forEach((p,i)=>console.log('c'+i+'_in_sg='+JSON.stringify(bestMatch(p,S))));
          sets.sg.forEach((p,i)=>console.log(['s0','s1','s2','g1','g2','g3'][i]+'_in_c='+JSON.stringify(bestMatch(p,C))));
          // Find exact overlap across every chunk boundary by suffix/prefix.
          function overlap(a,b,max=25000){for(let n=Math.min(a.length,b.length,max);n>=20;n--)if(a.slice(-n)===b.slice(0,n))return n;return 0}
          const all=[...sets.c.map((v,i)=>['c'+i,v]),...sets.sg.map((v,i)=>[['s0','s1','s2','g1','g2','g3'][i],v])];
          for(const [na,a] of all) for(const [nb,b] of all) if(na!==nb){const n=overlap(a,b);if(n>=20)console.log('overlap '+na+' -> '+nb+' = '+n);}
          NODE
