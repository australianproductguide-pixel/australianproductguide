name: APG Bundle Integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map fine-grained divergence in second S region
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/spans.json
          const C=['c0','c1','c2','c3','c4','c5'].map(n=>require('./bundle/'+n)).join('');
          const S=['s0','s1','s2','g1','g2','g3'].map(n=>require('./bundle/'+n)).join('');
          process.stdout.write(JSON.stringify({c:C.slice(29990,49880),s:S.slice(39984,62004)}));
          NODE
          python3 - <<'PY'
          import json,difflib
          d=json.load(open('/tmp/spans.json'))
          sm=difflib.SequenceMatcher(None,d['c'],d['s'],autojunk=False)
          print('CSPAN',len(d['c']),'SSPAN',len(d['s']))
          ops=sm.get_opcodes()
          print('OPCOUNT',len(ops))
          for i,(tag,a0,a1,b0,b1) in enumerate(ops):
              print(i,tag,a0,a1,b0,b1,'CLEN',a1-a0,'SLEN',b1-b0)
          PY
