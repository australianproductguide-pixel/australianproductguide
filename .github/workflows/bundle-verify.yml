name: APG Bundle Integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate compressed corruption offsets
        run: |
          set -euo pipefail
          node <<'NODE'
          const z=require('zlib');
          const sets={C:['c0','c1','c2','c3','c4','c5'].map(n=>require('./bundle/'+n)).join(''),S:['s0','s1','s2','g1','g2','g3'].map(n=>require('./bundle/'+n)).join('')};
          async function locate(name,b64){
            const buf=Buffer.from(b64,'base64');
            const d=z.createBrotliDecompress();
            let out=0, pos=0, failed=false, errCode='';
            d.on('data',x=>out+=x.length);
            d.on('error',e=>{failed=true;errCode=e.code});
            for(pos=0;pos<buf.length;pos+=32){
              if(failed) break;
              const chunk=buf.subarray(pos,Math.min(pos+32,buf.length));
              await new Promise(resolve=>d.write(chunk,()=>setImmediate(resolve)));
            }
            if(!failed){d.end();await new Promise(r=>setTimeout(r,100));}
            console.log(`${name}_COMPRESSED_BYTES=${buf.length}`);
            console.log(`${name}_FAIL_AFTER_INPUT_BYTE=${Math.min(pos,buf.length)} OUTPUT_BYTES=${out} ERROR=${errCode||'none'}`);
            console.log(`${name}_BASE64_APPROX_OFFSET=${Math.floor(Math.min(pos,buf.length)*4/3)}`);
          }
          (async()=>{await locate('C',sets.C);await locate('S',sets.S)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
