name: Amazon Associates QA

on:
  pull_request:
    paths:
      - 'api/**'
      - 'data/**'
      - 'lib/**'
      - 'scripts/amazon-associates-qa.js'
      - '.github/workflows/amazon-associates-qa.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'data/**'
      - 'lib/**'
      - 'scripts/amazon-associates-qa.js'
      - '.github/workflows/amazon-associates-qa.yml'

permissions:
  contents: read

jobs:
  amazon-associates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Amazon Associates checks
        run: node scripts/amazon-associates-qa.js
