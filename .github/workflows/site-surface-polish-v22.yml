name: Site surface polish v22 QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-surface-polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run site surface regression QA
        run: node scripts/site-surface-polish-v22-qa.js
