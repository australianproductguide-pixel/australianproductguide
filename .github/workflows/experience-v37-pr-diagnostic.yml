name: APG Experience v37 PR Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-interaction-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://australianproductguide.au
      OUTPUT_DIR: artifacts/experience-v37
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser driver
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null 2>&1
      - name: Run live Production consumer journeys
        run: |
          set -euo pipefail
          node --check scripts/experience-v37-browser-diagnostic.js
          node scripts/experience-v37-browser-diagnostic.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apg-experience-v37-pr-${{ github.run_id }}
          path: artifacts/experience-v37
          retention-days: 14
          if-no-files-found: warn
