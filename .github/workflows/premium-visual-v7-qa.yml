name: APG Premium Visual v7 QA

on:
  push:
    branches: [main, apg-visual-identity-v7-2026-08-16]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check visual platform
        run: |
          node --check lib/brand-v7.js
          node --check lib/platform-v7-runtime.js
          node --check lib/platform-v7-css.js
          node --check lib/platform-v7-rich-css.js
          node --check lib/platform-integrity-v15.js
          node --check lib/app.js
      - name: Verify established visual system and current semantic coverage
        run: |
          node <<'NODE'
          const brand=require('./lib/brand-v7');
          const integrity=require('./lib/platform-integrity-v15');
          const {categories}=require('./data');
          const slugs=Object.keys(categories);
          const established=Object.keys(brand.categoryMeta);
          if(slugs.length<90) throw new Error(`Expected at least 90 maintained categories, got ${slugs.length}`);
          if(established.length<48) throw new Error(`Established v7 visual coverage regressed: ${established.length}`);
          const missingEstablished=established.filter(x=>!categories[x]);
          if(missingEstablished.length) throw new Error(`Established visual categories no longer maintained: ${missingEstablished.join(', ')}`);
          const invalidFallback=slugs.filter(x=>!/^<svg[\s>]/.test(integrity.glyph(x)));
          if(invalidFallback.length) throw new Error(`Semantic visual fallback missing: ${invalidFallback.join(', ')}`);
          for(const slug of ['televisions','laptops','washing-machines','fridges','dishwashers','smartphones']){
            if(!categories[slug]) throw new Error(`Authority category missing: ${slug}`);
            if(integrity.glyph(slug)===integrity.glyph('__neutral__')) throw new Error(`Authority category still uses neutral fallback: ${slug}`);
          }
          if(!brand.logoSvg.includes('f4b45f')||!brand.logoSvg.includes('0b3044')) throw new Error('v7 logo tokens missing');
          if(/kangaroo|australia-map|shopping-cart|price-tag/i.test(brand.logoSvg)) throw new Error('Disallowed cliché found in logo');
          if(!brand.socialSvg.includes('Compare smarter. Choose with confidence.')) throw new Error('Social identity proposition missing');
          console.log(`PASS: ${slugs.length} maintained categories have an SSR semantic visual path; ${established.length} retain bespoke v7 scenes.`);
          NODE
      - name: Verify server render and visual continuity integration
        run: |
          grep -q "enhancePlatformV7" lib/app.js
          grep -q "platformV7Css" lib/app.js
          grep -q "platformV7RichCss" lib/app.js
          grep -q "logoDarkSvg" lib/app.js
          grep -q "data-platform-v7" lib/platform-v7-runtime.js
          grep -q "v7-signature-illustration" lib/platform-v7-runtime.js
          grep -q "suggest-thumb.type-product" lib/platform-v7-rich-css.js
          grep -q "apg-platform-v7-catalogue.csv" lib/app.js
          grep -q "platform-integrity-v15.css" lib/platform-integrity-v15.js
      - name: Preserve evidence and retailer invariants
        run: |
          node <<'NODE'
          const {products,categories}=require('./data');
          const exact=products.filter(p=>(p.retailers||[]).some(r=>r.kind==='affiliate-direct')).length;
          const deep=products.filter(p=>p.evidenceTier==='deep'||p.evidenceLevel==='deep').length;
          if(products.length<460) throw new Error(`Product coverage regressed: ${products.length}`);
          if(Object.keys(categories).length<90) throw new Error(`Category coverage regressed: ${Object.keys(categories).length}`);
          if(exact<20) throw new Error(`Exact Amazon coverage regressed: ${exact}`);
          if(deep<37) throw new Error(`Deep evidence coverage regressed: ${deep}`);
          console.log(`PASS: ${products.length} products, ${Object.keys(categories).length} categories, ${exact} exact affiliate-direct destinations; deep evidence=${deep}.`);
          NODE