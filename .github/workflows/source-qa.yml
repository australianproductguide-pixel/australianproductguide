name: APG Source QA

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Verify JavaScript syntax and module loading
        run: |
          set -euo pipefail
          for f in api/*.js data/*.js lib/*.js scripts/*.js; do echo "Checking $f"; node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs');
          require('./lib/app');
          const data=require('./data'); const routes=require('./lib/routes'); const search=require('./lib/search');
          const {clientJs}=require('./lib/client'); const {decisionClientJs}=require('./lib/decision-client'); const {platformV3ClientJs}=require('./lib/platform-v3-client');
          fs.writeFileSync('/tmp/apg-client.js',clientJs+decisionClientJs+platformV3ClientJs);
          console.log('MODULE_LOAD=PASS');
          console.log('PRODUCTS='+data.products.length); console.log('CATEGORIES='+Object.keys(data.categories).length); console.log('BRANDS='+routes.brands.length); console.log('PAIR_PAGES='+routes.pairPages.length); console.log('INDEXABLE_ROUTES='+routes.indexableRoutes.length); console.log('SEARCH_INDEX='+search.searchIndex().length);
          NODE
          node --check /tmp/apg-client.js

      - name: Verify Platform v3 catalogue retailer freshness and export invariants
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {products,pathways,categories}=require('./data');
          const {brands,pairPages,indexableRoutes}=require('./lib/routes');
          const {CREATORS_API}=require('./data/retailers');
          const {catalogueCsv,catalogueJson,headers}=require('./lib/catalogue-export');
          if(products.length!==257) throw new Error(`products ${products.length}`);
          if(pathways.length!==48||Object.keys(categories).length!==48) throw new Error('category/pathway population mismatch');
          if(pathways.some(p=>!p.maintained)) throw new Error('empty category pathway remains');
          if(pairPages.length!==144) throw new Error(`pairs ${pairPages.length}`);
          if(indexableRoutes.length!==722) throw new Error(`routes ${indexableRoutes.length}`);
          if(brands.length!==112) throw new Error(`brands ${brands.length}`);
          const deep=products.filter(p=>p.evidenceTier==='deep'),starter=products.filter(p=>p.evidenceTier==='starter');
          if(deep.length!==37||starter.length!==220) throw new Error(`evidence tiers deep=${deep.length} starter=${starter.length}`);
          for(const p of products){
            for(const key of ['firstResearched','lastSourceVerification','lastRetailerCheck','lastImageVerification','nextReviewDue','freshnessStatus','evidenceTier']) if(p[key]===undefined||p[key]===null) throw new Error(`freshness field ${key} missing ${p.slug}`);
            if(p.evidenceTier==='starter'&&p.lastSubstantiveReview!==null) throw new Error(`starter should not fake substantive review ${p.slug}`);
            if(p.evidenceTier==='starter'&&p.price!==null) throw new Error(`starter should not invent price ${p.slug}`);
          }
          const retailers=products.flatMap(p=>p.retailers.map(r=>({p,r})));
          const direct=retailers.filter(x=>x.r.kind==='affiliate-direct'),fallback=retailers.filter(x=>x.r.kind==='affiliate-search');
          if(direct.length!==6) throw new Error(`direct Amazon links ${direct.length}`);
          if(fallback.length!==251) throw new Error(`fallback Amazon links ${fallback.length}`);
          for(const {p,r} of retailers){
            const u=r.affiliateUrl||r.url;
            if(!u.includes('amazon.com.au')) throw new Error(`bad Amazon host ${p.slug}`);
            if(!u.includes('tag=auproductguid-22')) throw new Error(`missing affiliate tag ${p.slug}`);
            for(const key of ['retailer','kind','affiliateUrl','imageSource','imageProvenance','verified','availabilityConfidence']) if(r[key]===undefined||r[key]===null) throw new Error(`retailer field ${key} missing ${p.slug}`);
            if(r.kind==='affiliate-direct'&&(!r.asin||!r.exactUrl||!r.productIdentifier)) throw new Error(`direct metadata missing ${p.slug}`);
            if(r.imageUrl||r.imageVerified) throw new Error(`unapproved third-party image activated ${p.slug}`);
          }
          if(CREATORS_API.status!=='credentials-required') throw new Error('Creators API unexpectedly active');
          const json=catalogueJson(),csv=catalogueCsv();
          if(json.productCount!==257||json.categoryCount!==48||json.products.length!==257||json.commercialRecommendationWeight!==0) throw new Error('catalogue JSON export mismatch');
          if(headers.length!==32||csv.trimEnd().split('\n').length!==258) throw new Error('catalogue CSV export mismatch');
          if(json.products.some(p=>p['Commercial Recommendation Weight']!=='0')) throw new Error('commercial neutrality missing from export');
          console.log('PLATFORM_V3_CATALOGUE=PASS'); console.log('DEEP_EVIDENCE=37'); console.log('STARTER_EVIDENCE=220'); console.log('AMAZON_DIRECT=6'); console.log('AMAZON_FALLBACK=251'); console.log('CATALOGUE_EXPORT=257_PASS');
          NODE

      - name: Verify premium UX sharing privacy and image provenance controls
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {products}=require('./data'); const {imageStatus}=require('./data/image-provenance');
          const {css,logoSvg,socialSvg}=require('./lib/ui'); const {platformV3Css}=require('./lib/platform-v3-css'); const {platformV3ClientJs}=require('./lib/platform-v3-client');
          const runtime=require('./lib/platform-v3-runtime'); const content=require('./lib/content');
          const images=products.map(imageStatus);
          if(images.length!==257) throw new Error('image provenance missing products');
          if(images.some(x=>x.productPhotography||x.amazonProgramContent||x.displayUrl)) throw new Error('unverified product photography activated');
          for(const token of ['platform-sharebar','freshness-panel','platform-hub-grid','account-readiness','data-evidence-tier']) if(!(platformV3Css+platformV3ClientJs).includes(token)) throw new Error(`v3 UX control missing ${token}`);
          for(const token of ['navigator.share','data-copy-share','whatsapp','apgSavedComparisons','apgSavedGuides','apgRecentSearches']) if(!platformV3ClientJs.includes(token)) throw new Error(`share/workspace client control missing ${token}`);
          const u=new URL('https://au-product-guide.vercel.app/decision-lab/?q=robot+vacuum&_vercel_share=SECRET&utm_source=qa&category=robot-vacuums');
          const safe=runtime.safeSharePath('/decision-lab/',u); if(safe.includes('_vercel_share')||safe.includes('utm_source')||!safe.includes('category=robot-vacuums')) throw new Error('Decision Lab share sanitisation failed');
          for(const slug of ['about','privacy','terms','affiliate-disclosure','methodology','editorial-standards','sources','corrections-policy','coverage','updates','contact']) if(!content[slug]?.body) throw new Error(`trust content missing ${slug}`);
          if(!logoSvg.includes('Australian Product Guide')||!socialSvg.includes('Australian Product Guide')) throw new Error('brand asset title missing');
          if(!css.includes('focus-visible')||!css.includes('prefers-reduced-motion')) throw new Error('accessibility controls missing');
          console.log('PLATFORM_V3_UX_TRUST=PASS');
          NODE

      - name: Verify representative full-catalogue search behaviour
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {searchSite,searchIndex}=require('./lib/search');
          const tests=[
            ['best coffee machine under $800','coffee-machines'],['robot vacuum for pet hair','robot-vacuums'],['quiet headphones for long flights','wireless-headphones'],['air fryer for family of 4','air-fryers'],
            ['mesh wifi for a large home','mesh-wifi-systems'],['ergonomic office chair for long work days','office-chairs'],['power bank for a laptop and travel','power-banks'],['portable air conditioner for a bedroom','portable-air-conditioners'],['external ssd for a creator','external-ssds']
          ];
          for(const [q,cat] of tests){const r=searchSite(q);if(!r.products.some(p=>p.category===cat)) throw new Error(`bad search ${q} -> ${r.products[0]?.category}`);console.log(`SEARCH=${q} TOP=${r.products[0]?.slug}`)}
          const vs=searchSite('Breville vs DeLonghi'); if(!vs.directCompare) throw new Error('direct comparison detection failed');
          if(searchIndex().length<350) throw new Error('expanded search index unexpectedly small');
          console.log('FULL_CATALOGUE_SEARCH=PASS');
          NODE

      - name: Verify seven coffee matcher regression profiles
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {categories}=require('./data'); const {score}=require('./lib/coffee-finder'); const coffee=categories['coffee-machines'];
          const profiles=[
          ['QA001',{workflow:'one-touch',drink:'milk',learning:'almost',budget:'1500',speed:'high',space:'normal',beans:'rarely'},'delonghi-magnifica-start-with-milk-ecam22063b'],
          ['QA002',{workflow:'guided',drink:'milk',learning:'some',budget:'2000',speed:'medium',space:'normal',beans:'sometimes'},'breville-barista-touch-bes880'],
          ['QA003',{workflow:'guided',drink:'black',learning:'some',budget:'700',speed:'medium',space:'normal',beans:'rarely'},'sunbeam-barista-max-em5300s'],
          ['QA004',{workflow:'manual',drink:'mixed',learning:'control',budget:'1500',speed:'low',space:'any',beans:'often'},'delonghi-la-specialista-opera-ec9555m'],
          ['QA005',{workflow:'one-touch',drink:'mixed',learning:'almost',budget:'1500',speed:'high',space:'compact',beans:'sometimes'},'delonghi-magnifica-evo-ecam29083tb'],
          ['QA006',{workflow:'guided',drink:'cold',learning:'some',budget:'2000',speed:'medium',space:'normal',beans:'rarely'},'breville-barista-touch-impress-bes881'],
          ['QA007',{workflow:'one-touch',drink:'mixed',learning:'almost',budget:'1500',speed:'high',space:'normal',beans:'often'},'delonghi-rivelia-auto-milk-exam44055b']];
          for(const [id,q,expected] of profiles){const ranked=coffee.products.map(p=>score(p,q)).filter(p=>p.eligible).sort((a,b)=>b.score-a.score||a.price-b.price);if(ranked[0]?.slug!==expected) throw new Error(`${id} expected ${expected}, got ${ranked[0]?.slug}`)}
          console.log('COFFEE_MATCHER_QA=7/7_PASS');
          NODE

      - name: Verify venture separation in runtime source and data
        run: |
          set -euo pipefail
          if grep -RniE 'Australian Tradie Software Matcher|tradie-software|tradie matcher' api data lib scripts; then echo 'Cross-venture contamination detected'; exit 1; fi
          echo 'VENTURE_SEPARATION=PASS'
