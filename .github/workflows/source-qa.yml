name: APG Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apg-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-ready:
    name: Release Ready
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Full source and contract gate
        run: |
          set -euo pipefail
          for f in api/*.js data/*.js lib/*.js scripts/*.js; do node --check "$f"; done
          node scripts/favicon-parity-v115-qa.js
          node scripts/ebay-official-creatives-v121-qa.js
          npm run qa:full
          node scripts/pagespeed-agentic-certification-v113-qa.js
          node scripts/premium-mobile-decision-commerce-v112-qa.js
          node scripts/production-premium-mobile-v112-contract-qa.js
          node scripts/customer-journey-v114-qa.js
          node scripts/premium-mobile-decision-commerce-v112-depth-audit.js
          node scripts/scout-global-surface-v111-qa.js
          node scripts/runtime-chain-qa.js \
            vercel-analytics-v38 \
            pagespeed-certification-v30 \
            interaction-reliability-v37 \
            brand-conformity-v352 \
            brand-conformity-v351 \
            brand-conformity-v35 \
            brand-fidelity-v325 \
            brand-fidelity-v32

      - name: Account, search, recommendation and trust controls
        run: |
          set -euo pipefail
          node scripts/account-profile-v24-qa.js
          node scripts/account-journey-v241-qa.js
          node scripts/account-governance-v25-qa.js
          node scripts/auth-hardening-v23-qa.js
          node scripts/auth-password-policy-v361-qa.js
          node scripts/search-model-relevance-v36-qa.js
          node scripts/catalogue-source-authority-qa.js
          node scripts/brand-entity-reconciliation.js
          node scripts/amazon-asin-inventory-v33.js
          node scripts/amazon-associates-qa.js
          node scripts/amazon-conversion-v29-qa.js
          node scripts/evidence-commerce-depth-v27-qa.js
          node scripts/product-image-qa.js
          node scripts/editorial-compliance-qa.js
          node scripts/trust-infrastructure-v28-qa.js

      - name: Infrastructure and governance invariants
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('vercel.json','utf8'));
          const expect=(ok,msg)=>{if(!ok)throw new Error(msg)};
          expect(config.$schema==='https://openapi.vercel.sh/vercel.json','Vercel schema declaration missing');
          expect(JSON.stringify(config.regions)===JSON.stringify(['syd1']),`Expected Sydney function region, got ${JSON.stringify(config.regions)}`);
          expect(Array.isArray(config.routes)&&config.routes.length===7,'Expected one strictly governed P0 Home availability route, four private MCP/OAuth routes, filesystem handling and the API fallback');
          const homeP0=config.routes[0]||{};
          expect(homeP0.src==='/'&&homeP0.status===307,'P0 Home availability route must be an exact temporary 307 from root');
          expect(homeP0.headers?.Location==='/search/','P0 Home availability route must redirect only to the healthy APG Search surface');
          expect(homeP0.headers?.['Cache-Control']==='no-store, max-age=0','P0 Home availability route must not be cached');
          expect(homeP0.headers?.['X-APG-P0-Home-Availability']==='TEMPORARY_SEARCH_REDIRECT','P0 Home availability route must retain the explicit incident marker');
          expect(!('dest' in homeP0),'P0 Home availability route must remain a redirect, not an opaque rewrite');
          const protectedRoutes=[
            ['/mcp','/api/mcp'],
            ['/oauth/consent','/api/oauth-consent'],
            ['/.well-known/oauth-protected-resource/mcp','/api/mcp-oauth-metadata'],
            ['/.well-known/oauth-protected-resource','/api/mcp-oauth-metadata']
          ];
          protectedRoutes.forEach(([src,dest],i)=>expect(config.routes[i+1].src===src&&config.routes[i+1].dest===dest,`Unexpected protected MCP/OAuth route at position ${i+1}`));
          expect(config.routes[5].handle==='filesystem','Static filesystem routing must run before the general API fallback');
          expect(config.routes[6].src==='/(.*)'&&config.routes[6].dest==='/api','Unexpected dynamic fallback route');
          const deploymentEnabled=config.git?.deploymentEnabled||{};
          expect(deploymentEnabled['apg/*']===false&&deploymentEnabled['apg-*']===false,'Routine APG feature branches must not auto-deploy');
          const authoritativeWorkflowFiles=['amazon-shopping-assurance-v40.yml','catalogue-freshness-qa.yml','codeql.yml','indexnow.yml','production-smoke.yml','source-qa.yml'].sort();
          const supportWorkflowFiles=['category-editorial-research-v41.yml'].sort();
          const allowed=[...authoritativeWorkflowFiles,...supportWorkflowFiles].sort();
          const actual=fs.readdirSync('.github/workflows').filter(x=>/\.ya?ml$/.test(x)).sort();
          expect(JSON.stringify(actual)===JSON.stringify(allowed),`Workflow allowlist mismatch: ${actual.join(', ')}`);
          const ops=fs.readFileSync('docs/APG-OPERATIONS.md','utf8');
          for(const token of ['Source-of-truth hierarchy','Affiliate relationships, retailer availability and commission contribute **zero recommendation points**','APG Release Gate','APG Production Verification','07 – QA, Releases & Production Evidence','Australian Tradie Software Matcher']) expect(ops.includes(token),`Operating control missing: ${token}`);
          console.log('INFRASTRUCTURE_GOVERNANCE=PASS P0_HOME_EDGE_ROUTE=STRICTLY_GOVERNED');
          NODE

      - name: Upload release-control evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apg-release-gate-${{ github.run_id }}
          path: |
            artifacts/release-gate
            artifacts/amazon-au-mapping-register-v33.json
            artifacts/amazon-au-mapping-register-v33.csv
            artifacts/amazon-asin-summary-v33.json
          retention-days: 14
          if-no-files-found: ignore