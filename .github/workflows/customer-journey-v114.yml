name: Customer Journey v114

on:
  pull_request:
    paths:
      - 'api/index.js'
      - 'lib/customer-journey-programme-v114-runtime.js'
      - 'public/assets/customer-journey-programme-v114.js'
      - 'scripts/customer-journey-v114-qa.js'
      - '.github/workflows/customer-journey-v114.yml'

permissions:
  contents: read

jobs:
  customer-journey-v114:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: node --check lib/customer-journey-programme-v114-runtime.js
      - run: node --check public/assets/customer-journey-programme-v114.js
      - run: node scripts/customer-journey-v114-qa.js
