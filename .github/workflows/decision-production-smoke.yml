name: APG Decision Intelligence v4 Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  decision-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://australianproductguide.au
    steps:
      - uses: actions/checkout@v4
      - name: Wait for matching Vercel Production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            deployments=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA")
            id=$(echo "$deployments" | jq -r '[.[] | select(.environment=="Production" or .original_environment=="Production")][0].id // empty')
            if [ -n "$id" ]; then
              statuses=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments/$id/statuses")
              state=$(echo "$statuses" | jq -r '.[0].state // empty'); echo "Vercel Production state: ${state:-pending}"
              if [ "$state" = failure ] || [ "$state" = error ]; then exit 1; fi
              if [ "$state" = success ]; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
      - name: Verify mature Decision Lab shell and clean state
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/decision-lab/" -o /tmp/clean-lab.html
          for token in 'Decision Engine v4' 'data-decision-v4="true"' 'data-platform-v7="true"' 'My Australian Product Guide' 'No product is recommended until you provide a decision context'; do grep -q "$token" /tmp/clean-lab.html; done
          ! grep -q 'class="decision-result' /tmp/clean-lab.html
          url="$BASE_URL/decision-lab/?q=75-inch+TV+for+a+bright+living+room+sport+and+Netflix+under+%242500&category=televisions&utm_source=smoke"
          curl -fsSL "$url" -o /tmp/lab.html
          for token in 'Decision Engine v4' 'Hard constraints are enforced' '0 commercial scoring points' 'data-decision-v4="true"' 'data-platform-v7="true"' 'Maximum A$2,500' 'Target 75 inches' 'noindex,follow'; do grep -q "$token" /tmp/lab.html; done
      - name: Verify canonical Search v4
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/search/?q=quiet+dishwasher+under+1000" -o /tmp/search.html
          grep -q 'data-platform-v7="true"' /tmp/search.html
          grep -q '5 relevant maintained products' /tmp/search.html
          curl -fsSL "$BASE_URL/search/?q=TV+must+be+exactly+999+inches" -o /tmp/strict.html
          grep -q 'No maintained product can currently be verified against every hard constraint' /tmp/strict.html
          ! grep -q 'class="product-card' /tmp/strict.html
      - name: Verify decision API and graph
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/api/decision?q=Easy+automatic+coffee+machine+under+%241300+for+milk+drinks+and+switching+beans" -o /tmp/coffee.json
          test "$(jq -r '.version' /tmp/coffee.json)" = decision-engine-v4
          test "$(jq -r '.policyVersion' /tmp/coffee.json)" = decision-policy-v4.0
          test "$(jq -r '.commercialRecommendationWeight' /tmp/coffee.json)" = 0
          test "$(jq -r '.results[0].slug' /tmp/coffee.json)" = delonghi-rivelia-auto-milk-exam44055b
          test "$(jq -r '.results[0] | has("score")' /tmp/coffee.json)" = false
          curl -fsSL "$BASE_URL/api/decision?q=power+bank+must+support+USB-C+for+a+laptop&category=power-banks" -o /tmp/usb.json
          jq -e '.decisionState.hardConstraints.requiredTags | index("usb-c") != null' /tmp/usb.json >/dev/null
          curl -fsSL "$BASE_URL/api/intelligence/graph" -o /tmp/graph.json
          test "$(jq -r '.schemaVersion' /tmp/graph.json)" = product-intelligence-v1
          jq -e '.products >= 400 and .categories >= 80' /tmp/graph.json >/dev/null
      - name: Verify Scout and quality gate
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/assets/assistant.js" -o /tmp/scout.js
          node --check /tmp/scout.js
          grep -q 'canonicalStateQuery' /tmp/scout.js
          grep -q 'Decision Engine v4' /tmp/scout.js
          curl -fsSL "$BASE_URL/api/intelligence/quality" -o /tmp/quality.json
          test "$(jq -r '.releaseGate.pass' /tmp/quality.json)" = true
          test "$(jq -r '.evaluation.affiliateNeutrality.pass' /tmp/quality.json)" = true
          test "$(jq -r '.evaluation.constraintViolations' /tmp/quality.json)" = 0
