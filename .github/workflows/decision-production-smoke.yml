name: APG Decision Intelligence Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  decision-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://australianproductguide.au
    steps:
      - uses: actions/checkout@v4
      - name: Wait for matching Vercel Production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            deployments=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA")
            deployment_id=$(echo "$deployments" | jq -r '[.[] | select(.environment=="Production" or .original_environment=="Production")][0].id // empty')
            if [ -n "$deployment_id" ]; then
              statuses=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments/$deployment_id/statuses")
              state=$(echo "$statuses" | jq -r '.[0].state // empty')
              echo "Vercel Production state: ${state:-pending}"
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then exit 1; fi
              if [ "$state" = "success" ]; then exit 0; fi
            fi
            sleep 5
          done
          echo 'Timed out waiting for matching Vercel Production deployment'; exit 1

      - name: Verify Decision Lab v3 server render and privacy-safe sharing
        run: |
          set -euo pipefail
          url="$BASE_URL/decision-lab/?q=Best+value+robot+vacuum+for+pet+hair+and+mopping%2C+avoid+premium&category=robot-vacuums&_vercel_share=DO_NOT_PERSIST&utm_source=smoke"
          code=$(curl -sS -L -o /tmp/lab.html -w '%{http_code}' "$url"); test "$code" = "200"
          for token in 'APG Decision Lab' 'Decision Engine v3' 'Explainable shortlist' '0 commercial scoring points' 'noindex,follow' 'Robot Vacuum Omni C28' 'Avoid Premium' 'data-share-surface'; do grep -q "$token" /tmp/lab.html || { echo "Missing Decision Lab token: $token"; exit 1; }; done
          if grep -qE '_vercel_share|utm_source|DO_NOT_PERSIST' /tmp/lab.html; then echo 'Unsafe Decision Lab query leaked'; exit 1; fi
          grep -q 'data-share-url="/decision-lab/?q=' /tmp/lab.html
          if grep -q 'performance rating: [0-9]' /tmp/lab.html; then exit 1; fi
          echo 'DECISION_LAB_V3_PRODUCTION=PASS'

      - name: Verify Decision API v3 across deep and starter categories
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/api/decision?q=Easy+automatic+coffee+machine+under+%241300+for+milk+drinks+and+switching+beans" -o /tmp/coffee.json
          test "$(jq -r '.version' /tmp/coffee.json)" = "decision-engine-v3"
          test "$(jq -r '.commercialRecommendationWeight' /tmp/coffee.json)" = "0"
          test "$(jq -r '.results[0].slug' /tmp/coffee.json)" = "delonghi-rivelia-auto-milk-exam44055b"
          test "$(jq -r '.results[0] | has("score")' /tmp/coffee.json)" = "false"
          curl -fsSL "$BASE_URL/api/decision?q=mesh+wifi+for+a+large+home+with+ethernet" -o /tmp/mesh.json
          test "$(jq -r '.version' /tmp/mesh.json)" = "decision-engine-v3"
          test "$(jq -r '.interpretation.category' /tmp/mesh.json)" = "Mesh Wi-Fi systems"
          test "$(jq -r '.results[0].evidenceTier' /tmp/mesh.json)" = "starter"
          jq -e '.interpretation.decisionFactors | length > 2' /tmp/mesh.json >/dev/null
          echo 'DECISION_API_V3_PRODUCTION=PASS'

      - name: Verify My APG local-first with optional approved sync
        run: |
          set -euo pipefail
          code=$(curl -sS -L -o /tmp/workspace.html -w '%{http_code}' "$BASE_URL/my-apg/"); test "$code" = "200"
          for token in 'My APG' 'Browser-local storage' 'No account required' 'Optional cross-device My APG sync is active' 'noindex,follow' 'Recent searches' 'Saved comparisons' 'Saved guides'; do grep -q "$token" /tmp/workspace.html || { echo "Missing My APG token: $token"; exit 1; }; done
          curl -fsSL "$BASE_URL/assets/app.js" -o /tmp/app.js; node --check /tmp/app.js
          grep -q 'Optional account sync' /tmp/app.js
          for token in apgDecisionHistory apgSavedComparisons apgSavedGuides apgRecentSearches navigator.share data-copy-share whatsapp apgAccountSession gozovvhofdsshjuixcys.supabase.co data-delete-account; do grep -q "$token" /tmp/app.js || { echo "Missing app token: $token"; exit 1; }; done
          if grep -qiE 'service_role|SUPABASE_SERVICE_ROLE|firebaseio|clerk\.com' /tmp/app.js /tmp/workspace.html; then echo 'Unsafe account credential or unapproved provider appears active'; exit 1; fi
          echo 'MY_APG_OPTIONAL_SYNC_PRODUCTION=PASS'

      - name: Verify shareable dynamic comparison is noindex and sanitised
        run: |
          set -euo pipefail
          code=$(curl -sS -L -o /tmp/compare.html -w '%{http_code}' "$BASE_URL/compare/custom/?products=sony-wh-1000xm6,bose-quietcomfort-ultra-headphones,INVALID&_vercel_share=SECRET&utm_source=smoke"); test "$code" = "200"
          grep -qi 'noindex,follow' /tmp/compare.html
          grep -q 'WH-1000XM6' /tmp/compare.html; grep -q 'QuietComfort Ultra' /tmp/compare.html; grep -q 'data-share-surface' /tmp/compare.html
          if grep -qE '_vercel_share|utm_source|SECRET|INVALID' /tmp/compare.html; then echo 'Unsafe comparison share state leaked'; exit 1; fi
          grep -q 'products=sony-wh-1000xm6,bose-quietcomfort-ultra-headphones' /tmp/compare.html
          echo 'SHAREABLE_COMPARISON_PRIVACY=PASS'
