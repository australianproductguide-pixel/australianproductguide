name: APG Premium Brand v30 QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  brand-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check approved brand layer
        run: |
          node --check lib/premium-brand-v30.js
          node --check api/index.js
      - name: Verify approved identity assets and responsive lockup
        run: |
          node <<'NODE'
          const brand=require('./lib/premium-brand-v30');
          for(const [name,value] of Object.entries({logo:brand.logoSvg,dark:brand.logoDarkSvg,mono:brand.logoMonoSvg,social:brand.socialSvg,css:brand.css})){
            if(!value||value.length<100) throw new Error(`${name} asset missing or unexpectedly small`);
          }
          if(!brand.logoSvg.includes('#2563EB')||!brand.logoSvg.includes('#0F172A')) throw new Error('Approved blue/navy brand tokens missing');
          if(!brand.socialSvg.includes('Find the right product. Make the right decision.')) throw new Error('Approved social proposition missing');
          if(!brand.css.includes('@media(max-width:760px)')||!brand.css.includes('apg-brand-v30-monogram')) throw new Error('Responsive logo treatment missing');
          if(/kangaroo|southern cross|shopping cart|price tag|magnifying glass/i.test(brand.logoSvg)) throw new Error('Generic/cliche symbolism detected');

          const fixture='<html><head></head><body><header><a class="brand"><span class="v7-logo-lockup"><span class="v7-logo-mark"><svg></svg></span><span class="v7-logo-type"><strong>Australian Product Guide</strong><small>Old tagline</small></span></span></a></header><a class="footer-v11-wordmark">Australian Product Guide</a><span class="apg-assistant-launcher-icon"><svg></svg></span><span class="apg-assistant-avatar"><svg></svg></span></body></html>';
          const out=brand.injectBrand(fixture);
          if(!out.includes('data-brand-v30="true"')) throw new Error('Brand marker not injected');
          if(!out.includes('apg-brand-v30-lockup')) throw new Error('New lockup not injected');
          if(out.includes('v7-logo-lockup')) throw new Error('Legacy header lockup still present');
          if(!out.includes('/assets/premium-brand-v30.css?v=30')) throw new Error('Brand stylesheet not injected');
          if((out.match(/apg-brand-v30-scout/g)||[]).length!==2) throw new Error('Scout brand relationship not applied consistently');
          console.log('PASS: Premium Brand v30 source, assets, responsive treatment and integration fixture verified.');
          NODE
      - name: Verify production entrypoint preserves runtime chain
        run: |
          grep -q "premium-brand-v30" api/index.js
          grep -q "amazon-conversion-v29" lib/premium-brand-v30.js
