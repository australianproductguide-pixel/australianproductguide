name: Scout Concierge v5 QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scout-concierge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Scout v5 conversation and security QA
        run: node scripts/scout-concierge-v5-qa.js
