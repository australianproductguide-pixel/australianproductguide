name: Amazon AU ASIN Audit v33

on:
  push:
    branches: [apg/amazon-asin-audit-v33-final]
    paths:
      - 'data/**'
      - 'lib/amazon-conversion-v29.js'
      - 'scripts/amazon-asin-inventory-v33.js'
      - 'scripts/amazon-associates-qa.js'
      - 'scripts/amazon-conversion-v29-qa.js'
      - '.github/workflows/amazon-asin-audit-v33.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'lib/amazon-conversion-v29.js'
      - 'scripts/amazon-asin-inventory-v33.js'
      - 'scripts/amazon-associates-qa.js'
      - 'scripts/amazon-conversion-v29-qa.js'
      - '.github/workflows/amazon-asin-audit-v33.yml'

permissions:
  contents: read

jobs:
  asin-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate complete 482-product Amazon AU mapping register
        run: node scripts/amazon-asin-inventory-v33.js
      - name: Run Amazon Associates controls
        run: node scripts/amazon-associates-qa.js
      - name: Run Amazon conversion controls
        run: node scripts/amazon-conversion-v29-qa.js
      - name: Upload Amazon AU mapping register
        uses: actions/upload-artifact@v4
        with:
          name: amazon-au-mapping-register-v33
          path: |
            artifacts/amazon-au-mapping-register-v33.json
            artifacts/amazon-au-mapping-register-v33.csv
            artifacts/amazon-asin-summary-v33.json
          if-no-files-found: error
