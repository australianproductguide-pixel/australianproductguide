name: APG P0 Home bundle materialisation v128

on:
  push:
    branches:
      - release/p0-home-bundle-source-v1282

permissions:
  contents: write

concurrency:
  group: apg-p0-home-bundle-materialise-v128
  cancel-in-progress: false

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/p0-home-bundle-source-v1282
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact runtime dependencies without lifecycle scripts
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Generate twice and verify deterministic Home bundle
        run: |
          set -euo pipefail
          node scripts/build-home-css-v128.js
          test -f public/assets/home-v128-bundle.css
          cp public/assets/home-v128-bundle.css /tmp/home-v128-bundle-first.css
          first_sha=$(sha256sum /tmp/home-v128-bundle-first.css | awk '{print $1}')

          node scripts/build-home-css-v128.js
          cmp -s /tmp/home-v128-bundle-first.css public/assets/home-v128-bundle.css
          second_sha=$(sha256sum public/assets/home-v128-bundle.css | awk '{print $1}')
          test "$first_sha" = "$second_sha"
          test "$(wc -c < public/assets/home-v128-bundle.css | tr -d ' ')" = "544660"
          grep -F 'APG_HOME_CSS_LINK_SIGNATURE:69378df1a5f50c8965113dbfc040eb32cc4ba692be83aa460ed7ad4ab3a8d63e' public/assets/home-v128-bundle.css >/dev/null
          grep -F '.site-header' public/assets/home-v128-bundle.css >/dev/null
          grep -F '.apg-home-hero-v9' public/assets/home-v128-bundle.css >/dev/null
          grep -F '.apg-ebay-official-v121-card' public/assets/home-v128-bundle.css >/dev/null
          grep -F '#apgAssistantLauncher' public/assets/home-v128-bundle.css >/dev/null
          printf 'Verified deterministic bundle SHA-256: `%s`\n' "$second_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the verified bundle and remove this temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/home-v128-bundle.css
          git rm .github/workflows/p0-home-bundle-materialise-v128.yml
          changed=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n%s' '.github/workflows/p0-home-bundle-materialise-v128.yml' 'public/assets/home-v128-bundle.css')
          test "$changed" = "$expected"
          git commit -m 'Source-control deterministic Home CSS bundle v128.2'
          git push origin HEAD:release/p0-home-bundle-source-v1282
