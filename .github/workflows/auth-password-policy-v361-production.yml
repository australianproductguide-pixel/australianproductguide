name: APG Auth Password Policy v36.1 Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: write

jobs:
  auth-password-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://australianproductguide.au
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source policy
        run: |
          set -euo pipefail
          node --check lib/auth-password-policy-v361.js
          node --check scripts/auth-password-policy-v361-qa.js
          node scripts/auth-password-policy-v361-qa.js
      - name: Wait for exact Production SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA" >/tmp/deployments.json
            id=$(jq -r '[.[]|select(.environment=="Production" or .original_environment=="Production")][0].id//empty' /tmp/deployments.json)
            if [ -n "$id" ]; then
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments/$id/statuses" >/tmp/statuses.json
              state=$(jq -r '.[0].state//empty' /tmp/statuses.json)
              [ "$state" = failure ] || [ "$state" = error ] && exit 1
              [ "$state" = success ] && exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify Production account controls
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/assets/account-platform.js" >/tmp/account.js
          grep -q 'passwordInput.minLength=12' /tmp/account.js
          grep -q 'uppercase, lowercase, a number and a symbol' /tmp/account.js
          status=$(curl -sS -o /tmp/weak.json -w '%{http_code}' -X POST "$BASE_URL/api/account/signup" -H 'Origin: https://australianproductguide.au' -H 'Content-Type: application/json' --data '{"email":"qa-policy@example.invalid","password":"Weakpass1!"}')
          test "$status" = 400
          jq -e '.error|contains("at least 12 characters")' /tmp/weak.json >/dev/null
          status=$(curl -sS -o /tmp/origin.json -w '%{http_code}' -X POST "$BASE_URL/api/account/signup" -H 'Origin: https://example.invalid' -H 'Content-Type: application/json' --data '{"email":"qa-policy@example.invalid","password":"Weakpass1!"}')
          test "$status" = 403
          curl -fsSL "$BASE_URL/api/account/me" | jq -e '.authenticated==false' >/dev/null
          status=$(curl -sS -D /tmp/confirm.headers -o /tmp/confirm.body -w '%{http_code}' "$BASE_URL/auth/confirm?token_hash=invalid&type=email")
          test "$status" = 303
          grep -Eqi '^location: https://australianproductguide\.au/my-apg/\?auth=invalid' /tmp/confirm.headers
          grep -Eqi '^cache-control: no-store' /tmp/confirm.headers
          grep -Eqi '^referrer-policy: no-referrer' /tmp/confirm.headers
          grep -Eqi '^x-robots-tag: noindex, nofollow' /tmp/confirm.headers
          ! grep -Eqi 'stack trace|service_role|api[_ -]?key|postgres' /tmp/confirm.body
      - name: Confirm main remained on certified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/commits/main" | jq -r '.sha')
          test "$current" = "$SHA"
      - name: Publish auth policy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success; [ "$JOB_STATUS" = success ] || state=failure
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$(jq -n --arg state "$state" --arg context 'APG v36.1 Auth Password Policy' --arg description "Strong signup/reset password policy Production certification: $JOB_STATUS" --arg target_url "https://github.com/$REPO/actions/runs/$RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
