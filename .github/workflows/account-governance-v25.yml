name: My APG account governance v25 QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  account-governance-v25:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check lib/account-governance-v25.js
          node --check scripts/account-governance-v25-qa.js
      - name: Run governance regression QA
        run: node scripts/account-governance-v25-qa.js
