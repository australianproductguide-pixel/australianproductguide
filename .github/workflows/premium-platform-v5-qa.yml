name: APG Premium Platform v5 QA

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check premium platform modules
        run: |
          set -euo pipefail
          node --check lib/platform-v5-css.js
          node --check lib/platform-v5-runtime.js
          node --check lib/app.js
          node --check data/retailers.js
      - name: Verify v5 truth, commerce and sitemap controls
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('lib/app.js','utf8');
          const runtime=fs.readFileSync('lib/platform-v5-runtime.js','utf8');
          const css=fs.readFileSync('lib/platform-v5-css.js','utf8');
          const {direct,TAG}=require('./data/retailers');
          const {products,categories}=require('./data');
          const {indexableRoutes}=require('./lib/routes');
          if(!app.includes('enhancePlatformV5')) throw new Error('v5 runtime not wired');
          if(!app.includes('platformV5Css')) throw new Error('v5 CSS not wired');
          if(!app.includes('Disallow: /my-apg/')) throw new Error('My APG robots control missing');
          if(runtime.includes('APG does not currently operate consumer accounts')) throw new Error('stale inactive-account copy remains in v5 runtime');
          if(!runtime.includes('Optional cross-device My APG sync is active')) throw new Error('active account status missing');
          if(!runtime.includes('/sitemap/')) throw new Error('consumer sitemap footer link missing');
          if(!css.includes('APG ILLUSTRATION')) throw new Error('illustration labelling control missing');
          if(Object.keys(direct).length < 17) throw new Error('exact Amazon registry regressed');
          for(const [slug,d] of Object.entries(direct)){
            if(!d.asin || !/^B[A-Z0-9]{9}$/.test(d.asin)) throw new Error('invalid ASIN '+slug);
            if(!d.url.includes('amazon.com.au/') || !d.url.includes('tag='+TAG)) throw new Error('affiliate/direct URL control failed '+slug);
          }
          if(products.length!==257) throw new Error('catalogue count changed unexpectedly: '+products.length);
          if(Object.keys(categories).length!==48) throw new Error('category count changed unexpectedly');
          if(indexableRoutes.length<700) throw new Error('indexable route regression');
          console.log(JSON.stringify({products:products.length,categories:Object.keys(categories).length,directAmazon:Object.keys(direct).length,indexable:indexableRoutes.length}));
          console.log('APG_PREMIUM_V5_QA=PASS');
          NODE
