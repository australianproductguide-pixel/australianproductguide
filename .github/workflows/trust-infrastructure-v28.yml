name: APG Trust Infrastructure v28

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-infrastructure-v28:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check v28 source
        run: |
          node --check api/index.js
          node --check lib/trust-infrastructure-v28.js
          node --check public/assets/trust-infrastructure-v28.js
          node --check scripts/amazon-creators-image-import-v28.js
          node --check scripts/trust-infrastructure-v28-qa.js
      - name: Run Trust Infrastructure v28 QA
        run: node scripts/trust-infrastructure-v28-qa.js
      - name: Re-run v27 evidence and retailer regression gate
        run: node scripts/evidence-commerce-depth-v27-qa.js
      - name: Verify README catalogue reconciliation
        run: node scripts/catalogue-docs-reconciliation-v27.js
