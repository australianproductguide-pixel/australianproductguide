name: Product image QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-image-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate product image provenance and coverage
        run: node scripts/product-image-qa.js
      - name: Recheck Amazon Associates links and disclosure
        run: node scripts/amazon-associates-qa.js
