name: APG Brand Conformity v35.2 Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: write

jobs:
  focused-brand-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://australianproductguide.au
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact Production SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA" >/tmp/v352-deployments.json
            id=$(jq -r '[.[]|select(.environment=="Production" or .original_environment=="Production")][0].id//empty' /tmp/v352-deployments.json)
            if [ -n "$id" ]; then
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments/$id/statuses" >/tmp/v352-statuses.json
              state=$(jq -r '.[0].state//empty' /tmp/v352-statuses.json)
              [ "$state" = failure ] || [ "$state" = error ] && exit 1
              [ "$state" = success ] && exit 0
            fi
            sleep 5
          done
          echo 'Exact Production deployment not observed for v35.2' >&2
          exit 1
      - name: Verify v35.2 public contract
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/" >/tmp/v352-home.html
          grep -q 'data-brand-conformity-v352="true"' /tmp/v352-home.html
          grep -q '/assets/brand-conformity-v352.css?v=35.2' /tmp/v352-home.html
          curl -fsSL "$BASE_URL/assets/brand-conformity-v352.css?v=35.2" >/tmp/v352.css
          grep -q -- '--apg352-blue:#2563EB' /tmp/v352.css
          grep -q '.apg-national-v10' /tmp/v352.css
          grep -q '.search-suggestions .suggest-thumb' /tmp/v352.css
          grep -q '.scout-kicker' /tmp/v352.css
      - name: Render homepage depth autocomplete and Scout on desktop and mobile
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null 2>&1
          mkdir -p visual-v352
          CHROME="$CHROME" BASE_URL="$BASE_URL" VISUAL_OUT=visual-v352 node scripts/brand-conformity-v352-production.js
      - name: Confirm main remained on certified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/commits/main" | jq -r '.sha')
          test "$current" = "$SHA" || { echo "main advanced to $current during v35.2 certification" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apg-v352-focused-brand-${{ github.run_id }}
          path: visual-v352
          retention-days: 30
          if-no-files-found: warn
      - name: Publish retrievable v35.2 certification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success; [ "$JOB_STATUS" = success ] || state=failure
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$(jq -n --arg state "$state" --arg context 'APG v35.2 Focused Brand Certification' --arg description "Homepage depth/autocomplete/Scout certification: $JOB_STATUS" --arg target_url "https://github.com/$REPO/actions/runs/$RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
