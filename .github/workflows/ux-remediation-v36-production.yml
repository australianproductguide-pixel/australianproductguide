name: APG UX Remediation v36 Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: write

jobs:
  responsive-scout-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://australianproductguide.au
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source contract
        run: |
          set -euo pipefail
          node --check scripts/ux-remediation-v36-production.js
          grep -q "UX_CSS_PATH='/assets/ux-remediation-v36.css'" lib/brand-conformity-v351.js
          grep -q 'max-width:920px' public/assets/ux-remediation-v36.css
          grep -q 'not(\[data-v26-page="home"\])' public/assets/ux-remediation-v36.css
      - name: Wait for exact Production SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA" >/tmp/v36-deployments.json
            id=$(jq -r '[.[]|select(.environment=="Production" or .original_environment=="Production")][0].id//empty' /tmp/v36-deployments.json)
            if [ -n "$id" ]; then
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments/$id/statuses" >/tmp/v36-statuses.json
              state=$(jq -r '.[0].state//empty' /tmp/v36-statuses.json)
              [ "$state" = failure ] || [ "$state" = error ] && exit 1
              [ "$state" = success ] && exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify v36 public contract
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/" >/tmp/v36-home.html
          grep -q '/assets/ux-remediation-v36.css?v=36' /tmp/v36-home.html
          curl -fsSL "$BASE_URL/assets/ux-remediation-v36.css?v=36" >/tmp/v36.css
          grep -q 'max-width:920px' /tmp/v36.css
          grep -q 'apg-assistant-launcher' /tmp/v36.css
      - name: Render and certify responsive Scout states
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null 2>&1
          mkdir -p visual-v36
          CHROME="$CHROME" BASE_URL="$BASE_URL" VISUAL_OUT=visual-v36 node scripts/ux-remediation-v36-production.js
      - name: Confirm main remained on certified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/commits/main" | jq -r '.sha')
          test "$current" = "$SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apg-v36-responsive-ux-${{ github.run_id }}
          path: visual-v36
          retention-days: 30
          if-no-files-found: warn
      - name: Publish v36 responsive UX status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success; [ "$JOB_STATUS" = success ] || state=failure
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$(jq -n --arg state "$state" --arg context 'APG v36 Responsive UX Certification' --arg description "v36 responsive Scout overlay remediation: $JOB_STATUS" --arg target_url "https://github.com/$REPO/actions/runs/$RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
