name: APG Catalogue Freshness QA

on:
  push:
    branches: ['**']
  schedule:
    - cron: '20 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Generate freshness and stale-data queue
        run: |
          set -euo pipefail
          node scripts/freshness-report.js /tmp/apg-freshness.json
          cat /tmp/apg-freshness.md >> "$GITHUB_STEP_SUMMARY"
          node - <<'NODE'
          const r=require('/tmp/apg-freshness.json');
          const {products,categories}=require('./data');
          const expectedProducts=products.length,expectedCategories=Object.keys(categories).length;
          if(r.products!==expectedProducts||r.categories!==expectedCategories) throw new Error(`catalogue/report mismatch ${r.products}/${r.categories} vs ${expectedProducts}/${expectedCategories}`);
          if(expectedProducts<460||expectedCategories<90) throw new Error(`catalogue regression ${expectedProducts}/${expectedCategories}`);
          if(r.actionable!==0) throw new Error(`freshness queue has ${r.actionable} actionable stale/missing controls`);
          for(const expected of ['price-unmaintained','deep-research-pending','exact-amazon-link-pending','genuine-image-pending']) if(!(expected in r.byType)) throw new Error(`maturity queue missing ${expected}`);
          console.log(`CATALOGUE_FRESHNESS_CONTROLS=PASS products=${expectedProducts} categories=${expectedCategories}`);
          NODE
      - name: Verify canonical public brand reconciliation
        run: |
          set -euo pipefail
          node scripts/brand-entity-reconciliation.js
      - name: Upload freshness queue
        uses: actions/upload-artifact@v4
        with:
          name: apg-catalogue-freshness-${{ github.run_id }}
          path: |
            /tmp/apg-freshness.json
            /tmp/apg-freshness.md
          retention-days: 30