name: APG Brand Fidelity v32.5.2 QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-render-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check presentation chain
        run: |
          node --check lib/brand-fidelity-v325.js
          node --check lib/brand-fidelity-v324.js
          node --check lib/brand-conformity-v34.js
          node --check api/index.js
      - name: Verify SSR-stable semantic mobile controls and bounded client
        run: |
          node <<'NODE'
          const layer=require('./lib/brand-fidelity-v325');
          const fixture='<html><head></head><body><nav id="mobileNav" class="mobile-nav apg-mobile-v8"><div class="mobile-nav-inner"><a class="legacy-decision" href="/decision-lab/">Decision Lab legacy</a><a class="mobile-power" href="/decision-lab/">Decision Lab <span>→</span></a><button type="button" class="mobile-power apg-v26-scout-mobile" data-v26-scout-open data-v26-scout-mobile>Ask Scout <span>→</span></button><details class="mobile-section"><summary>Popular products</summary></details></div></nav></body></html>';
          const out=layer.inject(fixture);
          if(layer.VERSION!=='32.5.2')throw new Error(`expected v32.5.2, found ${layer.VERSION}`);
          const nav=(out.match(/<nav\b[^>]*\bid="mobileNav"[^>]*>[\s\S]*?<\/nav>/i)||[])[0]||'';
          if((nav.match(/href="\/decision-lab\/"/g)||[]).length!==1)throw new Error('mobile navigation must retain exactly one Decision Lab destination');
          if(!nav.includes('apg-v325-decision-mobile')||!nav.includes('apg-v325-scout-mobile'))throw new Error('approved Decision Lab / Ask Scout controls missing');
          if(nav.includes('legacy-decision'))throw new Error('legacy Decision Lab link survived SSR reconciliation');
          if(!out.includes('/assets/brand-fidelity-v325.css?v=32.5.2')||!out.includes('/assets/brand-fidelity-v325.js?v=32.5.2'))throw new Error('v32.5.2 cache-busted assets missing');
          if(!layer.css.includes('a[href="/decision-lab/"]:not(.apg-v325-decision-mobile){display:none!important}'))throw new Error('semantic CSS duplicate safeguard missing');
          if(!layer.clientJs.includes(':scope > a[href="/decision-lab/"]'))throw new Error('semantic client duplicate cleanup missing');
          if(layer.clientJs.includes('MutationObserver'))throw new Error('observer-loop regression detected');
          if(!layer.clientJs.includes('setTimeout(reconcile,120)')||!layer.clientJs.includes('setTimeout(reconcile,600)'))throw new Error('bounded reconciliation passes missing');
          if(typeof layer.amazonRecord!=='function'||typeof layer.transform!=='function')throw new Error('mature helper/export contract not preserved');
          console.log('PASS: v32.5.2 mobile hierarchy is semantic, SSR-stable and observer-loop free.');
          NODE
      - name: Verify current outer runtime remains Brand Conformity v34
        run: |
          grep -q "brand-conformity-v34" api/index.js
          node scripts/runtime-chain-qa.js brand-conformity-v34 brand-fidelity-v325 brand-fidelity-v324 brand-fidelity-v323 brand-fidelity-v322 brand-fidelity-v321 brand-fidelity-v32 amazon-conversion-v29 trust-infrastructure-v28 evidence-commerce-depth-v27 platform-cohesion-v26
