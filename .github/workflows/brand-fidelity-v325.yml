name: APG Brand Fidelity v32.5 QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-render-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check final presentation chain
        run: |
          node --check lib/brand-fidelity-v325.js
          node --check lib/brand-fidelity-v324.js
          node --check api/index.js
      - name: Verify SSR-stable mobile controls and CSS safeguards
        run: |
          node <<'NODE'
          const layer=require('./lib/brand-fidelity-v325');
          const fixture='<html><head></head><body><nav id="mobileNav" class="mobile-nav apg-mobile-v8"><div class="mobile-nav-inner"><a class="mobile-power" href="/decision-lab/">Decision Lab <span>→</span></a><button type="button" class="mobile-power apg-v26-scout-mobile" data-v26-scout-open data-v26-scout-mobile>Ask Scout <span>→</span></button><details class="mobile-section"><summary>Popular products</summary></details></div></nav></body></html>';
          const out=layer.inject(fixture);
          if(!out.includes('data-brand-fidelity-v325="true"'))throw new Error('v32.5 body marker missing');
          if(!out.includes('apg-v325-decision-mobile'))throw new Error('Decision Lab is not classified server-side');
          if(!out.includes('apg-v325-scout-mobile'))throw new Error('Ask Scout is not classified server-side');
          if(!out.includes('/assets/brand-fidelity-v325.css?v=32.5')||!out.includes('/assets/brand-fidelity-v325.js?v=32.5'))throw new Error('v32.5 assets missing');
          if(!layer.css.includes('.mobile-power:not(.apg-v325-decision-mobile):not(.apg-v325-scout-mobile){display:none!important}'))throw new Error('later duplicate action CSS guard missing');
          if(!layer.css.includes('.apg-v325-scout-mobile:before{content:"Ask Scout"'))throw new Error('Ask Scout visual label is not CSS-stable');
          if(!layer.css.includes('.apg-v325-decision-mobile:before{content:"Decision Lab"'))throw new Error('Decision Lab visual label is not CSS-stable');
          if(!layer.css.includes('order:30!important')||!layer.css.includes('order:31!important')||!layer.css.includes('.mobile-section{order:40!important}'))throw new Error('stable mobile grid order missing');
          if(typeof layer.amazonRecord!=='function'||typeof layer.transform!=='function')throw new Error('mature helper/export contract not preserved');
          console.log('PASS: v32.5 mobile controls are SSR-classified, CSS-labelled and order-stable.');
          NODE
      - name: Verify recursive mature runtime chain
        run: |
          node scripts/runtime-chain-qa.js brand-fidelity-v325 brand-fidelity-v324 brand-fidelity-v323 brand-fidelity-v322 brand-fidelity-v321 brand-fidelity-v32 amazon-conversion-v29 trust-infrastructure-v28 evidence-commerce-depth-v27 platform-cohesion-v26 account-governance-v25 account-profile-v24 auth-hardening-v23 site-surface-polish-v22
          grep -q "brand-fidelity-v325" api/index.js
