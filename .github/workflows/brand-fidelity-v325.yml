name: APG Brand Fidelity v32.5.2 QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-render-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check final presentation chain
        run: |
          node --check lib/brand-fidelity-v325.js
          node --check lib/brand-fidelity-v324.js
          node --check api/index.js
      - name: Verify semantic mobile hierarchy and bounded client
        run: |
          node <<'NODE'
          const layer=require('./lib/brand-fidelity-v325');
          const fixture='<html><head></head><body><nav id="mobileNav" class="mobile-nav apg-mobile-v8"><div class="mobile-nav-inner"><a class="legacy-decision-shortcut" href="/decision-lab/">Decision Lab →</a><a class="mobile-power" href="/decision-lab/">Decision Lab <span>→</span></a><button type="button" class="mobile-power apg-v26-scout-mobile" data-v26-scout-open data-v26-scout-mobile>Ask Scout <span>→</span></button><details class="mobile-section"><summary>Popular products</summary></details></div></nav></body></html>';
          const out=layer.inject(fixture);
          if(layer.VERSION!=='32.5.2')throw new Error(`expected v32.5.2, found ${layer.VERSION}`);
          if(!out.includes('data-brand-fidelity-v325="true"'))throw new Error('v32.5 body marker missing');
          if(!out.includes('apg-v325-decision-mobile'))throw new Error('Decision Lab is not classified server-side');
          if(!out.includes('apg-v325-scout-mobile'))throw new Error('Ask Scout is not classified server-side');
          if(!out.includes('/assets/brand-fidelity-v325.css?v=32.5.2')||!out.includes('/assets/brand-fidelity-v325.js?v=32.5.2'))throw new Error('v32.5.2 cache-busted assets missing');
          if(!out.includes('aria-label="Decision Lab"')||!out.includes('aria-label="Ask Scout"'))throw new Error('server-rendered accessible labels missing');
          const decisionLinks=(out.match(/href="\/decision-lab\/"/g)||[]).length;
          if(decisionLinks!==1)throw new Error(`mobile fixture must contain exactly one Decision Lab destination after SSR reconciliation; found ${decisionLinks}`);
          if(out.includes('legacy-decision-shortcut'))throw new Error('legacy semantic Decision Lab duplicate survived SSR reconciliation');
          if(!layer.css.includes('a[href="/decision-lab/"]:not(.apg-v325-decision-mobile){display:none!important}'))throw new Error('semantic CSS duplicate safeguard missing');
          if(!layer.css.includes('.mobile-power:not(.apg-v325-decision-mobile):not(.apg-v325-scout-mobile){display:none!important}'))throw new Error('later duplicate power-action CSS guard missing');
          if(!layer.css.includes('.apg-v325-scout-mobile:before{content:"Ask Scout"'))throw new Error('Ask Scout visual label is not CSS-stable');
          if(!layer.css.includes('.apg-v325-decision-mobile:before{content:"Decision Lab"'))throw new Error('Decision Lab visual label is not CSS-stable');
          if(!layer.css.includes('order:30!important')||!layer.css.includes('order:31!important')||!layer.css.includes('.mobile-section{order:40!important}'))throw new Error('stable mobile grid order missing');
          if(layer.clientJs.includes('MutationObserver'))throw new Error('v32.5.2 must not use MutationObserver');
          if(!layer.clientJs.includes(':scope > a[href="/decision-lab/"]'))throw new Error('client does not remove semantic Decision Lab duplicates');
          if(!layer.clientJs.includes('setTimeout(reconcile,120)')||!layer.clientJs.includes('setTimeout(reconcile,600)'))throw new Error('bounded reconciliation passes missing');
          if(typeof layer.amazonRecord!=='function'||typeof layer.transform!=='function')throw new Error('mature helper/export contract not preserved');
          console.log('PASS: v32.5.2 enforces exactly one semantic Decision Lab destination plus one Ask Scout control without observer loops.');
          NODE
      - name: Verify recursive mature runtime chain
        run: |
          node scripts/runtime-chain-qa.js brand-fidelity-v325 brand-fidelity-v324 brand-fidelity-v323 brand-fidelity-v322 brand-fidelity-v321 brand-fidelity-v32 amazon-conversion-v29 trust-infrastructure-v28 evidence-commerce-depth-v27 platform-cohesion-v26 account-governance-v25 account-profile-v24 auth-hardening-v23 site-surface-polish-v22
          grep -q "brand-fidelity-v325" api/index.js
