name: Amazon Conversion v29 QA

on:
  pull_request:
    paths:
      - 'api/**'
      - 'data/**'
      - 'lib/**'
      - 'scripts/amazon-associates-qa.js'
      - 'scripts/amazon-conversion-v29-qa.js'
      - '.github/workflows/amazon-associates-qa.yml'
      - '.github/workflows/amazon-conversion-v29.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'data/**'
      - 'lib/**'
      - 'scripts/amazon-associates-qa.js'
      - 'scripts/amazon-conversion-v29-qa.js'
      - '.github/workflows/amazon-associates-qa.yml'
      - '.github/workflows/amazon-conversion-v29.yml'

permissions:
  contents: read

jobs:
  amazon-conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing Amazon Associates controls
        run: node scripts/amazon-associates-qa.js
      - name: Run Amazon conversion v29 controls
        run: node scripts/amazon-conversion-v29-qa.js
