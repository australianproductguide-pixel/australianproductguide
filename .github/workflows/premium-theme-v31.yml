name: APG Premium Theme v31 QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  theme-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check theme runtime
        run: |
          node --check lib/premium-theme-v31.js
          node --check lib/premium-brand-v30.js
          node --check api/index.js
      - name: Verify approved site-wide design system
        run: |
          node <<'NODE'
          const theme=require('./lib/premium-theme-v31');
          const css=theme.css||'';
          if(css.length<12000) throw new Error(`Site-wide theme unexpectedly small: ${css.length}`);
          for(const token of ['#2563EB','#0F172A','#06B6D4','#10B981','#F1F5F9','#64748B']){
            if(!css.includes(token)) throw new Error(`Approved palette token missing: ${token}`);
          }
          for(const selector of ['.site-header','.apg-home-hero-v9','footer.apg-footer-v11','.apg-assistant-launcher','.apg-profile-hero-v24','.decision-hero','.product-card']){
            if(!css.includes(selector)) throw new Error(`Site-wide surface missing from theme: ${selector}`);
          }
          if(!css.includes('@media(max-width:920px)')||!css.includes('apg-brand-v30-monogram')) throw new Error('Approved compact mobile header treatment missing');
          const fixture='<html><head><meta name="theme-color" content="#ffffff"></head><body><main>Fixture</main></body></html>';
          const out=theme.injectTheme(fixture);
          if(!out.includes('data-theme-v31="true"')) throw new Error('Theme marker not injected');
          if(!out.includes('/assets/premium-theme-v31.css?v=31')) throw new Error('Theme stylesheet not injected');
          if(!out.includes('theme-color" content="#0F172A"')) throw new Error('Browser theme colour not aligned to APG Navy');
          console.log('PASS: Premium Theme v31 palette, whole-site surfaces, mobile treatment and injection verified.');
          NODE
      - name: Verify runtime chain and separation of concerns
        run: |
          grep -q "premium-theme-v31" api/index.js
          grep -q "premium-brand-v30" api/index.js
          grep -q "premium-brand-v30" lib/premium-theme-v31.js
          grep -q "amazon-conversion-v29" lib/premium-brand-v30.js
