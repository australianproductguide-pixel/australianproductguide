name: APG Evidence Commerce v27 Production Visual

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: write

jobs:
  visual-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://australianproductguide.au
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact Production SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA" >/tmp/apg-deployments.json
            id=$(jq -r '[.[]|select(.environment=="Production" or .original_environment=="Production")][0].id//empty' /tmp/apg-deployments.json)
            if [ -n "$id" ]; then
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments/$id/statuses" >/tmp/apg-deployment-statuses.json
              state=$(jq -r '.[0].state//empty' /tmp/apg-deployment-statuses.json)
              [ "$state" = failure ] || [ "$state" = error ] && exit 1
              [ "$state" = success ] && exit 0
            fi
            sleep 5
          done
          echo 'Exact Production deployment not observed' >&2
          exit 1
      - name: Verify v27 public contract
        run: |
          set -euo pipefail
          curl -fsSI "$BASE_URL/" >/tmp/apg-home.headers
          tr -d '\r' </tmp/apg-home.headers >/tmp/apg-home.headers.clean
          grep -qi 'x-apg-experience: evidence-commerce-depth-v27' /tmp/apg-home.headers.clean
          curl -fsSL "$BASE_URL/" >/tmp/apg-home.html
          grep -q 'data-evidence-commerce-v27="true"' /tmp/apg-home.html
          grep -q 'data-trust-v28="true"' /tmp/apg-home.html
          curl -fsSL "$BASE_URL/api/intelligence/observability" >/tmp/observability.json
          jq -e '.releaseGate.pass == true and .retailers.exactOfferCount >= 43 and .retailers.productsWithExactOffers >= 41 and .retailers.independentRetailerOfferCount >= 33 and .imagery.invalid == 0 and .scout.evaluation.pass == true' /tmp/observability.json >/dev/null
          curl -fsSL "$BASE_URL/api/intelligence/retailers" >/tmp/retailers.json
          jq -e '.recommendationWeight == 0 and .exactOfferCount >= 43 and .productsWithExactOffers >= 41 and .independentRetailerOfferCount >= 33' /tmp/retailers.json >/dev/null
          curl -fsSL "$BASE_URL/api/intelligence/imagery" >/tmp/imagery.json
          jq -e '.verified == 0 and .invalid == 0' /tmp/imagery.json >/dev/null
          curl -fsSL "$BASE_URL/api/intelligence/trust-readiness" >/tmp/trust-readiness.json
          jq -e '.version == "trust-infrastructure-v28" and .passwordPolicy.newPasswordMinLength == 12 and .retailers.exactOfferCount >= 43 and .imagery.automaticPublication == false and .organic.searchConsoleConnected == false' /tmp/trust-readiness.json >/dev/null
      - name: Render v27 desktop and mobile visual matrix
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null 2>&1
          mkdir -p visual-v27
          CHROME="$CHROME" BASE_URL="$BASE_URL" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const http=require('http');
          (async()=>{
            const base=process.env.BASE_URL;
            const productionOrigin=new URL(base).origin;
            const viewports=[['desktop',1440,1000],['mobile',390,844]];
            const pages=[
              ['home','/'],
              ['search','/search/?q=robot+vacuum+for+pet+hair'],
              ['laptops','/categories/laptops/'],
              ['headphones','/categories/wireless-headphones/'],
              ['retailer-product','/products/sony-wh-1000xm6/'],
              ['compare','/compare/custom/?products=sony-wh-1000xm6,bose-quietcomfort-ultra-headphones'],
              ['decision','/decision-lab/?q=75+inch+TV+for+a+bright+room+under+%242500'],
              ['workspace','/my-apg/'],
              ['privacy','/privacy/']
            ];
            const audit=[];
            const server=http.createServer(async(req,res)=>{
              const started=Date.now();
              try{
                const target=new URL(req.url||'/',base);
                if(target.origin!==productionOrigin)throw new Error('Proxy target escaped Production origin');
                const chunks=[];
                for await(const chunk of req)chunks.push(chunk);
                const requestBody=Buffer.concat(chunks);
                const headers={
                  accept:req.headers.accept||'*/*',
                  'accept-language':req.headers['accept-language']||'en-AU,en;q=0.9',
                  'cache-control':'no-cache',
                  'user-agent':'APG-Production-Visual-Certification/28'
                };
                if(req.headers['content-type'])headers['content-type']=req.headers['content-type'];
                const init={method:req.method||'GET',headers,redirect:'follow',signal:AbortSignal.timeout(45000)};
                if(requestBody.length&&!['GET','HEAD'].includes(init.method))init.body=requestBody;
                const upstream=await fetch(target,init);
                const body=Buffer.from(await upstream.arrayBuffer());
                const contentType=upstream.headers.get('content-type')||'application/octet-stream';
                const isHtml=contentType.toLowerCase().includes('text/html');
                if(isHtml){
                  const html=body.toString('utf8');
                  if(!upstream.ok)throw new Error(`Production HTML returned ${upstream.status} for ${target}`);
                  if(!html.includes('data-evidence-commerce-v27="true"'))throw new Error(`Production HTML missing v27 marker for ${target}`);
                  if(!html.includes('data-trust-v28="true"'))throw new Error(`Production HTML missing v28 marker for ${target}`);
                }
                res.statusCode=upstream.status;
                res.setHeader('content-type',contentType);
                res.setHeader('cache-control','no-store');
                res.setHeader('x-apg-visual-source','validated-production-byte-proxy');
                if(req.method==='HEAD')res.end();else res.end(body);
                audit.push({path:target.pathname+target.search,status:upstream.status,contentType,bytes:body.length,ms:Date.now()-started});
              }catch(err){
                console.error('VISUAL_PROXY_ERROR',req.url,err.message);
                res.statusCode=502;
                res.setHeader('content-type','text/plain; charset=utf-8');
                res.end('Production visual proxy failure');
                audit.push({path:req.url,status:502,error:err.message,ms:Date.now()-started});
              }
            });
            await new Promise((resolve,reject)=>{server.once('error',reject);server.listen(0,'127.0.0.1',resolve)});
            const address=server.address();
            const renderBase=`http://127.0.0.1:${address.port}`;
            console.log(`VISUAL_PRODUCTION_PROXY ${renderBase} -> ${base}`);

            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
            const report=[],bad=[];
            const preparePage=async(width,height)=>{
              const page=await browser.newPage();
              await page.setViewport({width,height});
              await page.setRequestInterception(true);
              page.on('request',req=>{
                const url=req.url();
                if(url.startsWith(renderBase)||url.startsWith('data:')||url.startsWith('blob:')||url==='about:blank')req.continue().catch(()=>{});
                else{
                  console.log(`VISUAL_BLOCKED_EXTERNAL ${url}`);
                  req.abort('blockedbyclient').catch(()=>{});
                }
              });
              return page;
            };
            const navigate=async(page,path)=>{
              const renderUrl=renderBase+path;
              let response=null,mainResponse=null,navigationTimedOut=false;
              const onResponse=r=>{if(r.request().isNavigationRequest()&&r.frame()===page.mainFrame())mainResponse=r;};
              page.on('response',onResponse);
              try{
                response=await page.goto(renderUrl,{waitUntil:'domcontentloaded',timeout:12000});
              }catch(err){
                if(err?.name!=='TimeoutError')throw err;
                navigationTimedOut=true;
                console.log(`VISUAL_LIFECYCLE_TIMEOUT ${path} - evaluating rendered state instead`);
              }
              await page.waitForSelector('body[data-evidence-commerce-v27="true"][data-trust-v28="true"]',{timeout:20000});
              await page.waitForFunction(()=>((document.body?.innerText||'').length>80),{timeout:10000});
              await page.waitForNetworkIdle({idleTime:400,timeout:3000}).catch(()=>{});
              await new Promise(r=>setTimeout(r,300));
              page.off('response',onResponse);
              const observed=response||mainResponse;
              return {status:observed?.status()||0,productionUrl:base+path,renderUrl,navigationTimedOut,transport:'validated-production-byte-proxy'};
            };
            try{
              for(const [vp,width,height] of viewports){
                for(const [name,path] of pages){
                  console.log(`VISUAL_ROUTE ${vp} ${name} ${path}`);
                  const page=await preparePage(width,height);
                  const errors=[];page.on('pageerror',e=>errors.push(e.message));
                  const nav=await navigate(page,path);
                  const state=await page.evaluate(()=>({
                    sw:document.documentElement.scrollWidth,
                    cw:document.documentElement.clientWidth,
                    v27:document.body?.dataset?.evidenceCommerceV27||'',
                    v28:document.body?.dataset?.trustV28||'',
                    text:document.body?.innerText?.length||0,
                    exactRetailer:document.querySelectorAll('.apg-exact-offers-v42').length,
                    coverageNote:document.querySelectorAll('.apg-v27-coverage-note').length,
                    researchView:document.querySelectorAll('[data-rv-root]').length
                  }));
                  await page.screenshot({path:`visual-v27/${vp}-${name}.png`,fullPage:true});
                  if(nav.status<200||nav.status>=400||state.sw>state.cw+2||state.v27!=='true'||state.v28!=='true'||state.text<80||errors.length)bad.push(`${vp}/${name}: ${JSON.stringify(state)} status=${nav.status} errors=${errors.join('|')}`);
                  if(name==='search'&&state.researchView<1)bad.push(`${vp}/${name}: Research View missing`);
                  if(name==='retailer-product'&&state.exactRetailer!==1)bad.push(`${vp}/${name}: expected one exact retailer block, found ${state.exactRetailer}`);
                  if(['laptops','headphones'].includes(name)&&state.coverageNote!==1)bad.push(`${vp}/${name}: v27 coverage note missing/duplicated`);
                  report.push({vp,name,...nav,...state,errors});
                  await page.close();
                }
                console.log(`VISUAL_ROUTE ${vp} scout-open /`);
                const page=await preparePage(width,height);
                const errors=[];page.on('pageerror',e=>errors.push(e.message));
                const nav=await navigate(page,'/');
                const open=await page.$('[data-v26-scout-open]')||await page.$('#apgAssistantLauncher');
                if(!open)bad.push(`${vp}/scout: launcher missing`);
                else{await open.click();await new Promise(r=>setTimeout(r,250));}
                const scout=await page.evaluate(()=>({
                  sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,
                  open:!document.getElementById('apgAssistantPanel')?.hidden,
                  input:!!document.querySelector('.scout-input')
                }));
                await page.screenshot({path:`visual-v27/${vp}-scout-open.png`,fullPage:false});
                if(nav.status<200||nav.status>=400||scout.sw>scout.cw+2||!scout.open||!scout.input||errors.length)bad.push(`${vp}/scout: ${JSON.stringify(scout)} status=${nav.status} ${errors.join('|')}`);
                report.push({vp,name:'scout-open',...nav,...scout,errors});
                await page.close();
              }
            }finally{
              await browser.close().catch(()=>{});
              await new Promise(resolve=>server.close(resolve));
            }
            fs.writeFileSync('visual-v27/report.json',JSON.stringify(report,null,2));
            fs.writeFileSync('visual-v27/production-proxy-audit.json',JSON.stringify(audit,null,2));
            const proxyFailures=audit.filter(row=>row.status>=400||row.error);
            if(proxyFailures.length)bad.push(`Production proxy recorded ${proxyFailures.length} failed request(s)`);
            if(report.length!==20)bad.push(`Expected 20 visual states, got ${report.length}`);
            if(bad.length){console.error(bad.join('\n'));process.exitCode=1;return;}
            console.log(`V27_VISUAL_CERTIFICATION=${report.length}_STATES_PASS`);
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Confirm main remained on certified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/commits/main" >/tmp/apg-main-commit.json
          current=$(jq -r '.sha' /tmp/apg-main-commit.json)
          test "$current" = "$SHA" || { echo "main advanced to $current during certification" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apg-v27-visual-${{ github.run_id }}
          path: visual-v27
          retention-days: 30
          if-no-files-found: warn
      - name: Publish retrievable visual certification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            api_state=success
            description='Fresh Production-byte desktop/mobile visual matrix passed'
          else
            api_state=failure
            description='v27 visual certification failed; inspect workflow'
          fi
          jq -n \
            --arg state "$api_state" \
            --arg target_url "https://github.com/$REPO/actions/runs/$RUN_ID" \
            --arg description "$description" \
            --arg context 'APG v27 Visual Certification' \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/apg-visual-status.json
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d @/tmp/apg-visual-status.json >/dev/null
