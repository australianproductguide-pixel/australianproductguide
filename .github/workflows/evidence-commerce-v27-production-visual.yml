name: APG Evidence Commerce v27 Production Visual

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: write

jobs:
  visual-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://australianproductguide.au
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact Production SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA" >/tmp/apg-deployments.json
            id=$(jq -r '[.[]|select(.environment=="Production" or .original_environment=="Production")][0].id//empty' /tmp/apg-deployments.json)
            if [ -n "$id" ]; then
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments/$id/statuses" >/tmp/apg-deployment-statuses.json
              state=$(jq -r '.[0].state//empty' /tmp/apg-deployment-statuses.json)
              [ "$state" = failure ] || [ "$state" = error ] && exit 1
              [ "$state" = success ] && exit 0
            fi
            sleep 5
          done
          echo 'Exact Production deployment not observed' >&2
          exit 1
      - name: Verify v27 public contract
        run: |
          set -euo pipefail
          curl -fsSI "$BASE_URL/" >/tmp/apg-home.headers
          tr -d '\r' </tmp/apg-home.headers >/tmp/apg-home.headers.clean
          grep -qi 'x-apg-experience: evidence-commerce-depth-v27' /tmp/apg-home.headers.clean
          curl -fsSL "$BASE_URL/" >/tmp/apg-home.html
          grep -q 'data-evidence-commerce-v27="true"' /tmp/apg-home.html
          curl -fsSL "$BASE_URL/api/intelligence/observability" >/tmp/observability.json
          jq -e '.releaseGate.pass == true and .retailers.exactOfferCount >= 43 and .retailers.productsWithExactOffers >= 41 and .retailers.independentRetailerOfferCount >= 33 and .imagery.invalid == 0 and .scout.evaluation.pass == true' /tmp/observability.json >/dev/null
          curl -fsSL "$BASE_URL/api/intelligence/retailers" >/tmp/retailers.json
          jq -e '.recommendationWeight == 0 and .exactOfferCount >= 43 and .productsWithExactOffers >= 41 and .independentRetailerOfferCount >= 33' /tmp/retailers.json >/dev/null
          curl -fsSL "$BASE_URL/api/intelligence/imagery" >/tmp/imagery.json
          jq -e '.verified == 0 and .invalid == 0' /tmp/imagery.json >/dev/null
      - name: Render v27 desktop and mobile visual matrix
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null 2>&1
          mkdir -p visual-v27
          CHROME="$CHROME" BASE_URL="$BASE_URL" node <<'NODE'
          const puppeteer=require('puppeteer-core'),fs=require('fs');
          (async()=>{
            const base=process.env.BASE_URL;
            const viewports=[['desktop',1440,1000],['mobile',390,844]];
            const pages=[
              ['home','/'],
              ['search','/search/?q=robot+vacuum+for+pet+hair'],
              ['laptops','/categories/laptops/'],
              ['headphones','/categories/wireless-headphones/'],
              ['retailer-product','/products/sony-wh-1000xm6/'],
              ['compare','/compare/custom/?products=sony-wh-1000xm6,bose-quietcomfort-ultra-headphones'],
              ['decision','/decision-lab/?q=75+inch+TV+for+a+bright+room+under+%242500'],
              ['workspace','/my-apg/'],
              ['privacy','/privacy/']
            ];
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
            const report=[],bad=[],documentCache=new Map();
            const productionDocument=async url=>{
              if(documentCache.has(url))return documentCache.get(url);
              const started=Date.now();
              const response=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(45000),headers:{'accept':'text/html,application/xhtml+xml','cache-control':'no-cache','user-agent':'APG-Production-Visual-Certification/28'}});
              const html=await response.text();
              const row={url:response.url,status:response.status,html,ms:Date.now()-started,csp:response.headers.get('content-security-policy')||''};
              if(!response.ok)throw new Error(`Production HTML fetch failed ${response.status} for ${url}`);
              if(!html.includes('data-evidence-commerce-v27="true"'))throw new Error(`Production HTML missing v27 marker for ${url}`);
              if(!html.includes('data-trust-v28="true"'))throw new Error(`Production HTML missing v28 marker for ${url}`);
              documentCache.set(url,row);
              return row;
            };
            const navigate=async(page,url)=>{
              const live=await productionDocument(url);
              let navigationTimedOut=false,fulfilled=false;
              await page.setRequestInterception(true);
              const onRequest=req=>{
                if(req.isNavigationRequest()&&req.frame()===page.mainFrame()&&!fulfilled){
                  fulfilled=true;
                  console.log(`VISUAL_DOCUMENT_FULFILLED ${url} chrome=${req.url()} production=${live.url}`);
                  const headers={'cache-control':'no-store','x-apg-visual-source':'validated-production-html'};
                  if(live.csp)headers['content-security-policy']=live.csp;
                  req.respond({status:live.status,contentType:'text/html; charset=utf-8',headers,body:live.html}).catch(()=>{});
                }else req.continue().catch(()=>{});
              };
              page.on('request',onRequest);
              try{
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:15000});
              }catch(err){
                if(err?.name!=='TimeoutError')throw err;
                navigationTimedOut=true;
              }
              if(!fulfilled)throw new Error(`Chrome main-frame document was not fulfilled for ${url}`);
              await page.waitForSelector('body[data-evidence-commerce-v27="true"][data-trust-v28="true"]',{timeout:10000});
              await page.waitForFunction(()=>((document.body?.innerText||'').length>80),{timeout:10000});
              await page.waitForNetworkIdle({idleTime:400,timeout:2500}).catch(()=>{});
              await new Promise(r=>setTimeout(r,200));
              return {status:live.status,productionFetchMs:live.ms,navigationTimedOut,transport:'validated-production-html'};
            };
            for(const [vp,width,height] of viewports){
              for(const [name,path] of pages){
                console.log(`VISUAL_ROUTE ${vp} ${name} ${path}`);
                const page=await browser.newPage();
                await page.setViewport({width,height});
                const errors=[];page.on('pageerror',e=>errors.push(e.message));
                const nav=await navigate(page,base+path);
                const state=await page.evaluate(()=>({
                  sw:document.documentElement.scrollWidth,
                  cw:document.documentElement.clientWidth,
                  v27:document.body?.dataset?.evidenceCommerceV27||'',
                  v28:document.body?.dataset?.trustV28||'',
                  text:document.body?.innerText?.length||0,
                  exactRetailer:document.querySelectorAll('.apg-exact-offers-v42').length,
                  coverageNote:document.querySelectorAll('.apg-v27-coverage-note').length,
                  researchView:document.querySelectorAll('[data-rv-root]').length
                }));
                await page.screenshot({path:`visual-v27/${vp}-${name}.png`,fullPage:true});
                if(nav.status>=400||state.sw>state.cw+2||state.v27!=='true'||state.v28!=='true'||state.text<80||errors.length)bad.push(`${vp}/${name}: ${JSON.stringify(state)} status=${nav.status} errors=${errors.join('|')}`);
                if(name==='search'&&state.researchView<1)bad.push(`${vp}/${name}: Research View missing`);
                if(name==='retailer-product'&&state.exactRetailer!==1)bad.push(`${vp}/${name}: expected one exact retailer block, found ${state.exactRetailer}`);
                if(['laptops','headphones'].includes(name)&&state.coverageNote!==1)bad.push(`${vp}/${name}: v27 coverage note missing/duplicated`);
                report.push({vp,name,...nav,...state,errors});
                if(nav.navigationTimedOut)console.log(`VISUAL_NAVIGATION_SETTLE_WARNING ${vp} ${name}`);
                await page.close();
              }
              console.log(`VISUAL_ROUTE ${vp} scout-open /`);
              const page=await browser.newPage();
              await page.setViewport({width,height});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              const nav=await navigate(page,base+'/');
              const open=await page.$('[data-v26-scout-open]')||await page.$('#apgAssistantLauncher');
              if(!open)bad.push(`${vp}/scout: launcher missing`);
              else{await open.click();await new Promise(r=>setTimeout(r,250));}
              const scout=await page.evaluate(()=>({
                sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,
                open:!document.getElementById('apgAssistantPanel')?.hidden,
                input:!!document.querySelector('.scout-input')
              }));
              await page.screenshot({path:`visual-v27/${vp}-scout-open.png`,fullPage:false});
              if(nav.status>=400||scout.sw>scout.cw+2||!scout.open||!scout.input||errors.length)bad.push(`${vp}/scout: ${JSON.stringify(scout)} status=${nav.status} ${errors.join('|')}`);
              report.push({vp,name:'scout-open',...nav,...scout,errors});
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('visual-v27/report.json',JSON.stringify(report,null,2));
            if(bad.length){console.error(bad.join('\n'));process.exitCode=1;return;}
            console.log(`V27_VISUAL_CERTIFICATION=${report.length}_STATES_PASS`);
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Confirm main remained on certified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/commits/main" >/tmp/apg-main-commit.json
          current=$(jq -r '.sha' /tmp/apg-main-commit.json)
          test "$current" = "$SHA" || { echo "main advanced to $current during certification" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apg-v27-visual-${{ github.run_id }}
          path: visual-v27
          retention-days: 30
          if-no-files-found: warn
      - name: Publish retrievable visual certification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            api_state=success
            description='Fresh desktop/mobile v27 visual matrix passed'
          else
            api_state=failure
            description='v27 visual certification failed; inspect workflow'
          fi
          jq -n \
            --arg state "$api_state" \
            --arg target_url "https://github.com/$REPO/actions/runs/$RUN_ID" \
            --arg description "$description" \
            --arg context 'APG v27 Visual Certification' \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' >/tmp/apg-visual-status.json
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d @/tmp/apg-visual-status.json >/dev/null
